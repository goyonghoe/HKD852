<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">2026 H1 ROADMAP</text>

  <!-- Q1 Badge -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="80" height="40" fill="#1A1A1A" rx="4"/>
    <text x="40" y="28" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">Q1</text>
  </g>

  <!-- Main Title -->
  <text x="200" y="172" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF">서비스 런칭</text>
  <text x="100" y="230" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#B0B0B0">3월 말 목표 · Global Service Launch</text>

  <!-- Divider -->
  <line x1="100" y1="280" x2="1820" y2="280" stroke="#333333" stroke-width="1"/>

  <!-- 3 Cards Layout (각 카드 540px, 간격 50px) -->
  <!-- 총 폭: 540×3 + 50×2 = 1720px (100px ~ 1820px) -->

  <!-- Card 1: SUPERSTAR -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#444444" stroke-width="2"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">▶</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">SUPERSTAR</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">THEBLACKLABEL</text>

    <!-- Content -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">글로벌 런칭</text>
    <text x="40" y="180" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">K-Pop 리듬게임</text>
    <text x="40" y="210" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">글로벌 동시 출시</text>

    <!-- Divider -->
    <line x1="40" y1="250" x2="500" y2="250" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="300" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 더블랙레이블 IP 기반</text>
    <text x="40" y="330" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 글로벌 론칭 마케팅</text>
    <text x="40" y="360" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 앱스토어 피처링 목표</text>

    <!-- Artist Tags -->
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="100" height="32" fill="#1A1A1A" rx="4"/>
      <text x="50" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">TAEYANG</text>

      <rect x="110" y="0" width="110" height="32" fill="#1A1A1A" rx="4"/>
      <text x="165" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">JEON SOMI</text>

      <rect x="230" y="0" width="80" height="32" fill="#1A1A1A" rx="4"/>
      <text x="270" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">MEOVV</text>

      <rect x="320" y="0" width="60" height="32" fill="#1A1A1A" rx="4"/>
      <text x="350" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">ADP</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="120" height="36" fill="#333333" rx="18"/>
      <text x="60" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#FFFFFF" text-anchor="middle">◉ PRIORITY</text>
    </g>
  </g>

  <!-- Card 2: Live Ops -->
  <g transform="translate(690, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">⚙</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">LIVE OPS</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">INFRASTRUCTURE</text>

    <!-- Content -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">운영 인프라</text>
    <text x="40" y="180" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">서버 · 모니터링 · CS</text>
    <text x="40" y="210" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">24/7 안정적 운영 체계</text>

    <!-- Divider -->
    <line x1="40" y1="250" x2="500" y2="250" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="300" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 글로벌 서버 인프라 구축</text>
    <text x="40" y="330" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 실시간 모니터링 대시보드</text>
    <text x="40" y="360" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• CS 대응 프로세스 정립</text>

    <!-- Tags -->
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="80" height="32" fill="#1A1A1A" rx="4"/>
      <text x="40" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">SERVER</text>

      <rect x="90" y="0" width="100" height="32" fill="#1A1A1A" rx="4"/>
      <text x="140" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">MONITOR</text>

      <rect x="200" y="0" width="60" height="32" fill="#1A1A1A" rx="4"/>
      <text x="230" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">CS</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="140" height="36" fill="#222222" rx="18"/>
      <text x="70" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">● EXECUTION</text>
    </g>
  </g>

  <!-- Card 3: IP Pipeline -->
  <g transform="translate(1280, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">★</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">IP PIPELINE</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">CONTENT CREATION</text>

    <!-- Content -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">콘텐츠 파이프라인</text>
    <text x="40" y="180" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">아티스트 IP 콘텐츠</text>
    <text x="40" y="210" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">제작 체계 가동</text>

    <!-- Divider -->
    <line x1="40" y1="250" x2="500" y2="250" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="300" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 정기 콘텐츠 업데이트 체계</text>
    <text x="40" y="330" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 아티스트 협업 프로세스</text>
    <text x="40" y="360" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 퀄리티 관리 기준 확립</text>

    <!-- Tags -->
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="70" height="32" fill="#1A1A1A" rx="4"/>
      <text x="35" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">MUSIC</text>

      <rect x="80" y="0" width="60" height="32" fill="#1A1A1A" rx="4"/>
      <text x="110" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">ART</text>

      <rect x="150" y="0" width="70" height="32" fill="#1A1A1A" rx="4"/>
      <text x="185" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">VIDEO</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="140" height="36" fill="#222222" rx="18"/>
      <text x="70" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">● EXECUTION</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MONTHLY REPORT · 2026 H1 ROADMAP</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="end">1 / 5</text>
</svg>
