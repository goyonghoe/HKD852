<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #04 TECH VIOLET - Executive Summary -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#1A1033;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1033"/>
      <stop offset="100%" style="stop-color:#0F0720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#A78BFA" letter-spacing="0.15em">EXECUTIVE SUMMARY</text>

  <!-- Title -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-weight="700" font-size="56" fill="#FAF5FF">핵심 결론</text>
  <text x="100" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#C4B5FD">AI는 모바일 게임 산업의 게임 체인저</text>

  <!-- Divider -->
  <line x1="100" y1="270" x2="1820" y2="270" stroke="#4C1D95" stroke-width="1"/>

  <!-- 3 Key Points -->
  <g transform="translate(100, 320)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <rect width="540" height="280" fill="url(#cardGrad)" rx="20" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="60" cy="60" r="28" fill="#8B5CF6"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#0F0720" text-anchor="middle">1</text>
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#FAF5FF">시장 폭발 성장</text>
      <line x1="40" y1="100" x2="500" y2="100" stroke="#4C1D95" stroke-width="1"/>
      <text x="40" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">6.5×</text>
      <text x="180" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">성장 (2024→2034)</text>
      <text x="40" y="200" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD">$5.85B → $37.89B</text>
      <text x="40" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#A78BFA">CAGR 20.54%</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(570, 0)">
      <rect width="540" height="280" fill="url(#cardGrad)" rx="20" stroke="#4C1D95" stroke-width="1"/>
      <circle cx="60" cy="60" r="28" fill="#2E1A47"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#FAF5FF" text-anchor="middle">2</text>
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#FAF5FF">개발자 채택 가속</text>
      <line x1="40" y1="100" x2="500" y2="100" stroke="#4C1D95" stroke-width="1"/>
      <text x="40" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">90%</text>
      <text x="180" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">개발자 AI 사용</text>
      <text x="40" y="200" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD">95%가 반복작업 감소 체감</text>
      <text x="40" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#A78BFA">Google Cloud Research, 2025</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(1140, 0)">
      <rect width="540" height="280" fill="url(#cardGrad)" rx="20" stroke="#4C1D95" stroke-width="1"/>
      <circle cx="60" cy="60" r="28" fill="#2E1A47"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#FAF5FF" text-anchor="middle">3</text>
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#FAF5FF">모바일이 선도</text>
      <line x1="40" y1="100" x2="500" y2="100" stroke="#4C1D95" stroke-width="1"/>
      <text x="40" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">54%</text>
      <text x="180" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">게이머가 모바일</text>
      <text x="40" y="200" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD">32억+ 모바일 게이머 (2025)</text>
      <text x="40" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#A78BFA">Udonis 2026 Report</text>
    </g>
  </g>

  <!-- Bottom Message -->
  <g transform="translate(100, 680)">
    <rect width="1720" height="100" fill="#1A1033" rx="16" stroke="#8B5CF6" stroke-width="1"/>
    <text x="860" y="60" font-family="Pretendard, sans-serif" font-weight="500" font-size="24" fill="#FAF5FF" text-anchor="middle">
      지금 준비하지 않으면 <tspan fill="#8B5CF6">경쟁에서 뒤처집니다</tspan>
    </text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1A1033" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA">AI × MOBILE GAMING</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA" text-anchor="end">2 / 8</text>
</svg>
