<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #04 TECH VIOLET - Complication: AI Changes Everything -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#1A1033;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1033"/>
      <stop offset="100%" style="stop-color:#0F0720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#A78BFA" letter-spacing="0.15em">COMPLICATION</text>

  <!-- Title -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-weight="700" font-size="56" fill="#FAF5FF">AI가 바꾸는 게임 개발</text>
  <text x="100" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#C4B5FD">개발자 90%가 이미 AI를 사용 중</text>

  <!-- Divider -->
  <line x1="100" y1="270" x2="1820" y2="270" stroke="#4C1D95" stroke-width="1"/>

  <!-- Main Stats -->
  <g transform="translate(100, 320)">
    <!-- Big Stat Card -->
    <g transform="translate(0, 0)">
      <rect width="600" height="450" fill="url(#cardGrad)" rx="20" stroke="#8B5CF6" stroke-width="2"/>
      <text x="300" y="80" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle" letter-spacing="0.1em">DEVELOPER ADOPTION</text>

      <!-- Big Number -->
      <text x="300" y="250" font-family="Inter, sans-serif" font-weight="800" font-size="180" fill="#8B5CF6" text-anchor="middle">90%</text>

      <text x="300" y="320" font-family="Pretendard, sans-serif" font-weight="400" font-size="28" fill="#FAF5FF" text-anchor="middle">게임 개발자가</text>
      <text x="300" y="360" font-family="Pretendard, sans-serif" font-weight="400" font-size="28" fill="#FAF5FF" text-anchor="middle">AI를 사용 중</text>

      <text x="300" y="420" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">Source: Google Cloud Research, 2025</text>
    </g>

    <!-- Side Stats -->
    <g transform="translate(640, 0)">
      <!-- Stat 1 -->
      <g transform="translate(0, 0)">
        <rect width="520" height="140" fill="url(#cardGrad)" rx="16"/>
        <text x="40" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">95%</text>
        <text x="180" y="45" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">반복 작업 감소 체감</text>
        <text x="40" y="100" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD">"AI가 시간을 아껴준다"</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(0, 155)">
        <rect width="520" height="140" fill="url(#cardGrad)" rx="16"/>
        <text x="40" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">73%</text>
        <text x="180" y="45" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">게임 스튜디오 AI 도입</text>
        <text x="40" y="100" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD">a16z 조사, 2024</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(0, 310)">
        <rect width="520" height="140" fill="url(#cardGrad)" rx="16"/>
        <text x="40" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#8B5CF6">67%</text>
        <text x="180" y="45" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E9D5FF">개발자 AI에 "흥분"</text>
        <text x="40" y="100" font-family="Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD">"AI가 게임 개발을 바꾼다"</text>
      </g>
    </g>

    <!-- Arrow and Insight -->
    <g transform="translate(1200, 0)">
      <rect width="520" height="450" fill="url(#cardGrad)" rx="20"/>
      <text x="260" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle" letter-spacing="0.1em">KEY INSIGHT</text>

      <text x="260" y="180" font-family="Inter, sans-serif" font-weight="300" font-size="80" fill="#8B5CF6" text-anchor="middle">→</text>

      <text x="260" y="280" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">AI는 선택이 아닌</text>
      <text x="260" y="330" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#8B5CF6" text-anchor="middle">필수</text>

      <text x="260" y="400" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">AI 없이는</text>
      <text x="260" y="430" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">경쟁 불가</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1A1033" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA">AI × MOBILE GAMING</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA" text-anchor="end">4 / 8</text>
</svg>
