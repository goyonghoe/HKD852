<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #04 TECH VIOLET - Market Situation -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#1A1033;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1033"/>
      <stop offset="100%" style="stop-color:#0F0720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#A78BFA" letter-spacing="0.15em">SITUATION</text>

  <!-- Title -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-weight="700" font-size="56" fill="#FAF5FF">모바일 게임 시장 현황</text>
  <text x="100" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#C4B5FD">전체 게임 산업의 절반을 차지하는 거대 시장</text>

  <!-- Divider -->
  <line x1="100" y1="270" x2="1820" y2="270" stroke="#4C1D95" stroke-width="1"/>

  <!-- Main Data Cards -->
  <g transform="translate(100, 320)">
    <!-- Left: Market Size -->
    <g transform="translate(0, 0)">
      <rect width="840" height="400" fill="url(#cardGrad)" rx="20"/>
      <text x="50" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" letter-spacing="0.1em">MOBILE GAMING MARKET 2025</text>

      <!-- Big Number -->
      <text x="50" y="200" font-family="Inter, sans-serif" font-weight="800" font-size="130" fill="#8B5CF6">$103B</text>

      <text x="50" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#E9D5FF">전체 게임 시장의</text>
      <text x="50" y="310" font-family="Inter, sans-serif" font-weight="700" font-size="36" fill="#FAF5FF">55% 점유</text>

      <text x="50" y="370" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#A78BFA">Source: Udonis, 2026</text>
    </g>

    <!-- Right: Gamers -->
    <g transform="translate(880, 0)">
      <rect width="840" height="400" fill="url(#cardGrad)" rx="20"/>
      <text x="50" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" letter-spacing="0.1em">MOBILE GAMERS 2025</text>

      <!-- Big Number -->
      <text x="50" y="200" font-family="Inter, sans-serif" font-weight="800" font-size="120" fill="#8B5CF6">3.2B+</text>

      <text x="50" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#E9D5FF">전체 게이머 33.2억 명 중</text>
      <text x="50" y="310" font-family="Inter, sans-serif" font-weight="700" font-size="36" fill="#FAF5FF">54%가 모바일</text>

      <!-- Visual Bar -->
      <rect x="50" y="340" width="700" height="20" fill="#2E1A47" rx="10"/>
      <rect x="50" y="340" width="378" height="20" fill="#8B5CF6" rx="10"/>
      <text x="440" y="355" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FAF5FF">54%</text>

      <text x="50" y="385" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#A78BFA">Source: TechJury / DemandSage, 2026</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(100, 780)">
    <rect width="1720" height="80" fill="#1A1033" rx="12"/>
    <text x="860" y="50" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E9D5FF" text-anchor="middle">
      모바일 게임은 이미 <tspan fill="#8B5CF6">가장 큰 게임 플랫폼</tspan> → AI 도입의 최대 수혜 시장
    </text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1A1033" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA">AI × MOBILE GAMING</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA" text-anchor="end">3 / 8</text>
</svg>
