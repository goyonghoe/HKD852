<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #04 TECH VIOLET - AI Applications -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#1A1033;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1033"/>
      <stop offset="100%" style="stop-color:#0F0720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#A78BFA" letter-spacing="0.15em">HOW</text>

  <!-- Title -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-weight="700" font-size="56" fill="#FAF5FF">AI 활용 4대 분야</text>
  <text x="100" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#C4B5FD">개발 전 과정에서 AI가 효율을 높이고 있습니다</text>

  <!-- Divider -->
  <line x1="100" y1="270" x2="1820" y2="270" stroke="#4C1D95" stroke-width="1"/>

  <!-- 4 Application Cards -->
  <g transform="translate(100, 320)">
    <!-- Card 1: Playtesting -->
    <g transform="translate(0, 0)">
      <rect width="400" height="380" fill="url(#cardGrad)" rx="20" stroke="#8B5CF6" stroke-width="2"/>
      <text x="200" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#8B5CF6" text-anchor="middle">47%</text>
      <text x="200" y="100" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle">ADOPTION RATE</text>
      <line x1="40" y1="130" x2="360" y2="130" stroke="#4C1D95" stroke-width="1"/>
      <text x="200" y="180" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">플레이테스트</text>
      <text x="200" y="215" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">&amp; 밸런싱</text>
      <text x="200" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">AI 봇이 24/7 게임 테스트</text>
      <text x="200" y="300" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">버그 탐지 자동화</text>
      <text x="200" y="350" font-family="Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">Modl.ai $15M 투자 유치</text>
    </g>

    <!-- Card 2: Localization -->
    <g transform="translate(440, 0)">
      <rect width="400" height="380" fill="url(#cardGrad)" rx="20"/>
      <text x="200" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#8B5CF6" text-anchor="middle">45%</text>
      <text x="200" y="100" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle">ADOPTION RATE</text>
      <line x1="40" y1="130" x2="360" y2="130" stroke="#4C1D95" stroke-width="1"/>
      <text x="200" y="180" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">현지화</text>
      <text x="200" y="215" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">&amp; 번역</text>
      <text x="200" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">다국어 번역 자동화</text>
      <text x="200" y="300" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">문화적 맥락 반영</text>
      <text x="200" y="350" font-family="Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">글로벌 출시 기간 단축</text>
    </g>

    <!-- Card 3: Code Generation -->
    <g transform="translate(880, 0)">
      <rect width="400" height="380" fill="url(#cardGrad)" rx="20"/>
      <text x="200" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#8B5CF6" text-anchor="middle">44%</text>
      <text x="200" y="100" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle">ADOPTION RATE</text>
      <line x1="40" y1="130" x2="360" y2="130" stroke="#4C1D95" stroke-width="1"/>
      <text x="200" y="180" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">코드 생성</text>
      <text x="200" y="215" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">&amp; 스크립팅</text>
      <text x="200" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">반복 코드 자동 생성</text>
      <text x="200" y="300" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">디버깅 지원</text>
      <text x="200" y="350" font-family="Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">Roblox AI 스크립팅 도구</text>
    </g>

    <!-- Card 4: Creative Design -->
    <g transform="translate(1320, 0)">
      <rect width="400" height="380" fill="url(#cardGrad)" rx="20"/>
      <text x="200" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#8B5CF6" text-anchor="middle">36%</text>
      <text x="200" y="100" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle">ADOPTION RATE</text>
      <line x1="40" y1="130" x2="360" y2="130" stroke="#4C1D95" stroke-width="1"/>
      <text x="200" y="180" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">크리에이티브</text>
      <text x="200" y="215" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF" text-anchor="middle">디자인</text>
      <text x="200" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">레벨/캐릭터 자동 생성</text>
      <text x="200" y="300" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" text-anchor="middle">에셋 프로토타이핑</text>
      <text x="200" y="350" font-family="Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">GenAI 콘텐츠 생성</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(100, 760)">
    <rect width="1720" height="80" fill="#1A1033" rx="12"/>
    <text x="860" y="50" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E9D5FF" text-anchor="middle">
      Source: Google Cloud Research, 2025.8 | 37%가 <tspan fill="#8B5CF6">"새로운 게임플레이/내러티브 실험 증가"</tspan> 체감
    </text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1A1033" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA">AI × MOBILE GAMING</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA" text-anchor="end">6 / 8</text>
</svg>
