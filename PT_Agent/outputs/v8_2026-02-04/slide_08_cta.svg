<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #04 TECH VIOLET - CTA Slide -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#1A1033;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1033"/>
      <stop offset="100%" style="stop-color:#0F0720"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#A78BFA" letter-spacing="0.15em">CALL TO ACTION</text>

  <!-- Title -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-weight="700" font-size="56" fill="#FAF5FF">다음 행동</text>
  <text x="100" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="24" fill="#C4B5FD">지금 시작해야 할 3단계 액션 플랜</text>

  <!-- Divider -->
  <line x1="100" y1="270" x2="1820" y2="270" stroke="#4C1D95" stroke-width="1"/>

  <!-- 3 Action Steps -->
  <g transform="translate(100, 320)">
    <!-- Step 1: This Week -->
    <g transform="translate(0, 0)">
      <rect width="540" height="380" fill="url(#cardGrad)" rx="20" stroke="#8B5CF6" stroke-width="2"/>

      <!-- Step Number -->
      <rect x="40" y="40" width="80" height="80" fill="#8B5CF6" rx="16"/>
      <text x="80" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#0F0720" text-anchor="middle">1</text>

      <!-- Timeline Badge -->
      <rect x="140" y="55" width="100" height="32" fill="#2E1A47" rx="16"/>
      <text x="190" y="77" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#8B5CF6" text-anchor="middle">이번 주</text>

      <line x1="40" y1="140" x2="500" y2="140" stroke="#4C1D95" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF">AI 도구 탐색</text>

      <text x="40" y="250" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ ChatGPT/Claude로 게임 기획</text>
      <text x="40" y="285" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ Midjourney로 컨셉 아트</text>
      <text x="40" y="320" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ GitHub Copilot 테스트</text>

      <text x="270" y="365" font-family="Pretendard, sans-serif" font-weight="500" font-size="14" fill="#A78BFA" text-anchor="middle">투자: 무료~$20/월</text>
    </g>

    <!-- Step 2: This Month -->
    <g transform="translate(580, 0)">
      <rect width="540" height="380" fill="url(#cardGrad)" rx="20"/>

      <!-- Step Number -->
      <rect x="40" y="40" width="80" height="80" fill="#2E1A47" rx="16"/>
      <text x="80" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#FAF5FF" text-anchor="middle">2</text>

      <!-- Timeline Badge -->
      <rect x="140" y="55" width="100" height="32" fill="#2E1A47" rx="16"/>
      <text x="190" y="77" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#8B5CF6" text-anchor="middle">이번 달</text>

      <line x1="40" y1="140" x2="500" y2="140" stroke="#4C1D95" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF">파일럿 프로젝트</text>

      <text x="40" y="250" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ 소규모 기능에 AI 적용</text>
      <text x="40" y="285" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ 현지화/QA 자동화 시도</text>
      <text x="40" y="320" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ 효율 측정 (시간/비용)</text>

      <text x="270" y="365" font-family="Pretendard, sans-serif" font-weight="500" font-size="14" fill="#A78BFA" text-anchor="middle">목표: 30% 효율 개선 검증</text>
    </g>

    <!-- Step 3: This Quarter -->
    <g transform="translate(1160, 0)">
      <rect width="540" height="380" fill="url(#cardGrad)" rx="20"/>

      <!-- Step Number -->
      <rect x="40" y="40" width="80" height="80" fill="#2E1A47" rx="16"/>
      <text x="80" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#FAF5FF" text-anchor="middle">3</text>

      <!-- Timeline Badge -->
      <rect x="140" y="55" width="100" height="32" fill="#2E1A47" rx="16"/>
      <text x="190" y="77" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#8B5CF6" text-anchor="middle">이번 분기</text>

      <line x1="40" y1="140" x2="500" y2="140" stroke="#4C1D95" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#FAF5FF">전사 확대</text>

      <text x="40" y="250" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ AI 도입 로드맵 수립</text>
      <text x="40" y="285" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ 팀 교육 프로그램</text>
      <text x="40" y="320" font-family="Pretendard, sans-serif" font-weight="400" font-size="18" fill="#E9D5FF">□ 예산/인력 배정</text>

      <text x="270" y="365" font-family="Pretendard, sans-serif" font-weight="500" font-size="14" fill="#A78BFA" text-anchor="middle">목표: AI-First 조직 전환</text>
    </g>
  </g>

  <!-- Final CTA Banner -->
  <g transform="translate(100, 760)">
    <rect width="1720" height="100" fill="#8B5CF6" rx="20"/>
    <text x="860" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#0F0720" text-anchor="middle" letter-spacing="0.1em">NEXT STEP</text>
    <text x="860" y="80" font-family="Pretendard, sans-serif" font-weight="700" font-size="28" fill="#0F0720" text-anchor="middle">
      오늘 회의 후 첫 번째 AI 도구를 팀에 공유하세요
    </text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1A1033" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA">AI × MOBILE GAMING</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#A78BFA" text-anchor="end">8 / 8</text>
</svg>
