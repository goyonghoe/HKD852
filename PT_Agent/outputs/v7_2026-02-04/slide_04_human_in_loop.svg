<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
    v7: Modern Slate Dark Palette
    Human-in-the-Loop 3단계 플로우
  -->

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:0.3"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>

    <!-- Accent Card Gradient -->
    <linearGradient id="accentCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#64748B" letter-spacing="0.15em">CORE PRINCIPLE</text>

  <!-- Title -->
  <text x="100" y="190" font-family="Inter, sans-serif" font-weight="700" font-size="68" fill="#F8FAFC">Human-in-the-Loop</text>

  <!-- Subtitle -->
  <text x="100" y="250" font-family="Pretendard, sans-serif" font-weight="400" font-size="26" fill="#94A3B8">AI의 효율 + 인간의 통제 = 균형 잡힌 의사결정</text>

  <!-- Divider -->
  <line x1="100" y1="300" x2="1820" y2="300" stroke="#334155" stroke-width="1"/>

  <!-- 3-Step Flow -->
  <g transform="translate(100, 360)">

    <!-- Step 1: AI 제안 -->
    <g transform="translate(0, 0)">
      <rect width="500" height="340" fill="url(#cardGrad)" rx="20"/>

      <!-- Step Number -->
      <circle cx="60" cy="60" r="28" fill="#334155"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" text-anchor="middle">1</text>

      <!-- Title -->
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC">AI 제안</text>

      <!-- Divider -->
      <line x1="40" y1="100" x2="460" y2="100" stroke="#334155" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">데이터 분석</text>
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">옵션 생성</text>
      <text x="40" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">초안 작성</text>

      <!-- Badge -->
      <rect x="40" y="280" width="100" height="36" fill="#334155" rx="18"/>
      <text x="90" y="304" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" text-anchor="middle">AI 담당</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(540, 150)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#475569" stroke-width="2"/>
      <polygon points="60,0 50,-8 50,8" fill="#475569"/>
    </g>

    <!-- Step 2: 인간 검토 -->
    <g transform="translate(640, 0)">
      <rect width="500" height="340" fill="url(#cardGrad)" rx="20"/>

      <!-- Step Number -->
      <circle cx="60" cy="60" r="28" fill="#334155"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" text-anchor="middle">2</text>

      <!-- Title -->
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC">인간 검토</text>

      <!-- Divider -->
      <line x1="40" y1="100" x2="460" y2="100" stroke="#334155" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">맥락 판단</text>
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">품질 검증</text>
      <text x="40" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">리스크 평가</text>

      <!-- Badge -->
      <rect x="40" y="280" width="100" height="36" fill="#1E3A5F" rx="18"/>
      <text x="90" y="304" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#7DD3FC" text-anchor="middle">팀 담당</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(1180, 150)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#475569" stroke-width="2"/>
      <polygon points="60,0 50,-8 50,8" fill="#475569"/>
    </g>

    <!-- Step 3: 최종 결정 (Highlighted) -->
    <g transform="translate(1280, 0)">
      <rect width="440" height="340" fill="url(#cardGrad)" rx="20" stroke="#38BDF8" stroke-width="1.5"/>
      <rect width="440" height="340" fill="url(#accentCard)" rx="20"/>

      <!-- Step Number (Accent) -->
      <circle cx="60" cy="60" r="28" fill="#38BDF8"/>
      <text x="60" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#0F172A" text-anchor="middle">3</text>

      <!-- Title -->
      <text x="110" y="68" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC">최종 결정</text>

      <!-- Divider -->
      <line x1="40" y1="100" x2="400" y2="100" stroke="#334155" stroke-width="1"/>

      <!-- Content -->
      <text x="40" y="150" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">책임 있는 승인</text>
      <text x="40" y="190" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">최종 판단</text>
      <text x="40" y="230" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#E2E8F0">실행 지시</text>

      <!-- Badge (Accent) -->
      <rect x="40" y="280" width="120" height="36" fill="#38BDF8" rx="18"/>
      <text x="100" y="304" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#0F172A" text-anchor="middle">사람 결정</text>
    </g>
  </g>

  <!-- Bottom Message -->
  <g transform="translate(100, 780)">
    <rect width="1720" height="90" fill="#1E293B" rx="16"/>
    <text x="860" y="55" font-family="Pretendard, sans-serif" font-weight="500" font-size="24" fill="#F8FAFC" text-anchor="middle">
      핵심 의사결정은 <tspan fill="#38BDF8">항상</tspan> 사람이 담당
    </text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B">MONTHLY REPORT · 2026 H1</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B" text-anchor="end">4 / 5</text>
</svg>
