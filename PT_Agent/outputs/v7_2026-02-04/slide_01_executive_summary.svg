<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
    v7: Modern Slate Dark Palette (2026 Trend)
    - Soft Black 배경 (#0F172A)
    - Sky Blue 악센트 (#38BDF8)
    - Subtle gradient overlay
  -->

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:0.3"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>

    <!-- Accent Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Section Label -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#64748B" letter-spacing="0.15em">2026 H1 EXECUTIVE SUMMARY</text>

  <!-- Title: Bold & Large -->
  <text x="100" y="200" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#F8FAFC">런칭</text>
  <text x="280" y="200" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#38BDF8">→</text>
  <text x="360" y="200" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#F8FAFC">운영 체계 구축</text>

  <!-- Subtitle -->
  <text x="100" y="270" font-family="Pretendard, sans-serif" font-weight="400" font-size="26" fill="#94A3B8">Q1 글로벌 서비스 출시 · Q2 AI 기반 효율화</text>

  <!-- Divider -->
  <line x1="100" y1="320" x2="1820" y2="320" stroke="#334155" stroke-width="1"/>

  <!-- Bento Grid Layout -->
  <g transform="translate(100, 370)">

    <!-- Q1 Card (Large) -->
    <g transform="translate(0, 0)">
      <rect width="820" height="380" fill="url(#cardGrad)" rx="20"/>

      <!-- Q1 Background Number -->
      <text x="40" y="120" font-family="Inter, sans-serif" font-weight="800" font-size="160" fill="#1E293B">Q1</text>

      <!-- Content -->
      <text x="50" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.1em">QUARTER 1</text>
      <text x="50" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#F8FAFC">서비스 런칭</text>

      <text x="50" y="220" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0">SUPERSTAR THEBLACKLABEL</text>
      <text x="50" y="255" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">글로벌 동시 출시</text>

      <!-- Target Badge -->
      <rect x="50" y="300" width="130" height="44" fill="#38BDF8" rx="22"/>
      <text x="115" y="328" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#0F172A" text-anchor="middle">3월 목표</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(860, 170)">
      <text x="0" y="30" font-family="Inter, sans-serif" font-weight="300" font-size="48" fill="#475569">→</text>
    </g>

    <!-- Q2 Card (Large) -->
    <g transform="translate(900, 0)">
      <rect width="820" height="380" fill="url(#cardGrad)" rx="20"/>

      <!-- Q2 Background Number -->
      <text x="40" y="120" font-family="Inter, sans-serif" font-weight="800" font-size="160" fill="#1E293B">Q2</text>

      <!-- Content -->
      <text x="50" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.1em">QUARTER 2</text>
      <text x="50" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#F8FAFC">AI 운영 체계</text>

      <text x="50" y="220" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0">AI Agent 조직 모델</text>
      <text x="50" y="255" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Human-in-the-Loop</text>

      <!-- Target Badge -->
      <rect x="50" y="300" width="130" height="44" fill="#334155" rx="22"/>
      <text x="115" y="328" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#94A3B8" text-anchor="middle">6월 목표</text>
    </g>
  </g>

  <!-- Bottom Key Message Card -->
  <g transform="translate(100, 800)">
    <rect width="1720" height="100" fill="#1E293B" rx="16" stroke="#334155" stroke-width="1"/>
    <text x="860" y="40" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="0.1em">KEY MESSAGE</text>
    <text x="860" y="75" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0" text-anchor="middle">런칭 성공 → AI로 운영 효율화 → 인간 중심 의사결정 유지</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B">MONTHLY REPORT · 2026 H1</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B" text-anchor="end">1 / 5</text>
</svg>
