<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #01 MODERN SLATE DARK -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Palette Label -->
  <rect x="100" y="40" width="280" height="36" fill="#1E293B" rx="18"/>
  <text x="240" y="64" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#38BDF8" text-anchor="middle">#01 MODERN SLATE DARK</text>

  <!-- Section Label -->
  <text x="100" y="130" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#64748B" letter-spacing="0.15em">2026 H1 EXECUTIVE SUMMARY</text>

  <!-- Title -->
  <text x="100" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#F8FAFC">런칭</text>
  <text x="280" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#38BDF8">→</text>
  <text x="360" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#F8FAFC">운영 체계 구축</text>

  <!-- Subtitle -->
  <text x="100" y="310" font-family="Pretendard, sans-serif" font-weight="400" font-size="26" fill="#94A3B8">Q1 글로벌 서비스 출시 · Q2 AI 기반 효율화</text>

  <!-- Divider -->
  <line x1="100" y1="360" x2="1820" y2="360" stroke="#334155" stroke-width="1"/>

  <!-- Bento Grid -->
  <g transform="translate(100, 410)">
    <!-- Q1 Card -->
    <g transform="translate(0, 0)">
      <rect width="820" height="340" fill="url(#cardGrad)" rx="20"/>
      <text x="40" y="110" font-family="Inter, sans-serif" font-weight="800" font-size="140" fill="#1E293B">Q1</text>
      <text x="50" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.1em">QUARTER 1</text>
      <text x="50" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#F8FAFC">서비스 런칭</text>
      <text x="50" y="205" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0">SUPERSTAR THEBLACKLABEL</text>
      <text x="50" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">글로벌 동시 출시</text>
      <rect x="50" y="275" width="130" height="44" fill="#38BDF8" rx="22"/>
      <text x="115" y="303" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#0F172A" text-anchor="middle">3월 목표</text>
    </g>

    <!-- Arrow -->
    <text x="860" y="190" font-family="Inter, sans-serif" font-weight="300" font-size="48" fill="#475569">→</text>

    <!-- Q2 Card -->
    <g transform="translate(900, 0)">
      <rect width="820" height="340" fill="url(#cardGrad)" rx="20"/>
      <text x="40" y="110" font-family="Inter, sans-serif" font-weight="800" font-size="140" fill="#1E293B">Q2</text>
      <text x="50" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.1em">QUARTER 2</text>
      <text x="50" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#F8FAFC">AI 운영 체계</text>
      <text x="50" y="205" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0">AI Agent 조직 모델</text>
      <text x="50" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Human-in-the-Loop</text>
      <rect x="50" y="275" width="130" height="44" fill="#334155" rx="22"/>
      <text x="115" y="303" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#94A3B8" text-anchor="middle">6월 목표</text>
    </g>
  </g>

  <!-- Bottom Key Message -->
  <g transform="translate(100, 800)">
    <rect width="1720" height="100" fill="#1E293B" rx="16" stroke="#334155" stroke-width="1"/>
    <text x="860" y="40" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="0.1em">KEY MESSAGE</text>
    <text x="860" y="75" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E2E8F0" text-anchor="middle">런칭 성공 → AI로 운영 효율화 → 인간 중심 의사결정 유지</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B">MONTHLY REPORT · 2026 H1</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B" text-anchor="end">PALETTE COMPARISON</text>
</svg>
