<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- #08 MONO CONTRAST -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#18181B;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#18181B"/>
      <stop offset="100%" style="stop-color:#09090B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#09090B"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Palette Label -->
  <rect x="100" y="40" width="230" height="36" fill="#18181B" rx="18"/>
  <text x="215" y="64" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#08 MONO CONTRAST</text>

  <!-- Section Label -->
  <text x="100" y="130" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#71717A" letter-spacing="0.15em">2026 H1 EXECUTIVE SUMMARY</text>

  <!-- Title -->
  <text x="100" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#FAFAFA">런칭</text>
  <text x="280" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF">→</text>
  <text x="360" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="72" fill="#FAFAFA">운영 체계 구축</text>

  <!-- Subtitle -->
  <text x="100" y="310" font-family="Pretendard, sans-serif" font-weight="400" font-size="26" fill="#A1A1AA">Q1 글로벌 서비스 출시 · Q2 AI 기반 효율화</text>

  <!-- Divider -->
  <line x1="100" y1="360" x2="1820" y2="360" stroke="#3F3F46" stroke-width="1"/>

  <!-- Bento Grid -->
  <g transform="translate(100, 410)">
    <!-- Q1 Card -->
    <g transform="translate(0, 0)">
      <rect width="820" height="340" fill="url(#cardGrad)" rx="20"/>
      <text x="40" y="110" font-family="Inter, sans-serif" font-weight="800" font-size="140" fill="#18181B">Q1</text>
      <text x="50" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#71717A" letter-spacing="0.1em">QUARTER 1</text>
      <text x="50" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#FAFAFA">서비스 런칭</text>
      <text x="50" y="205" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E4E4E7">SUPERSTAR THEBLACKLABEL</text>
      <text x="50" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#A1A1AA">글로벌 동시 출시</text>
      <rect x="50" y="275" width="130" height="44" fill="#FFFFFF" rx="22"/>
      <text x="115" y="303" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#09090B" text-anchor="middle">3월 목표</text>
    </g>

    <!-- Arrow -->
    <text x="860" y="190" font-family="Inter, sans-serif" font-weight="300" font-size="48" fill="#3F3F46">→</text>

    <!-- Q2 Card -->
    <g transform="translate(900, 0)">
      <rect width="820" height="340" fill="url(#cardGrad)" rx="20"/>
      <text x="40" y="110" font-family="Inter, sans-serif" font-weight="800" font-size="140" fill="#18181B">Q2</text>
      <text x="50" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#71717A" letter-spacing="0.1em">QUARTER 2</text>
      <text x="50" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#FAFAFA">AI 운영 체계</text>
      <text x="50" y="205" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E4E4E7">AI Agent 조직 모델</text>
      <text x="50" y="240" font-family="Pretendard, sans-serif" font-weight="400" font-size="20" fill="#A1A1AA">Human-in-the-Loop</text>
      <rect x="50" y="275" width="130" height="44" fill="#27272A" rx="22"/>
      <text x="115" y="303" font-family="Inter, sans-serif" font-weight="500" font-size="16" fill="#A1A1AA" text-anchor="middle">6월 목표</text>
    </g>
  </g>

  <!-- Bottom Key Message -->
  <g transform="translate(100, 800)">
    <rect width="1720" height="100" fill="#18181B" rx="16" stroke="#3F3F46" stroke-width="1"/>
    <text x="860" y="40" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#71717A" text-anchor="middle" letter-spacing="0.1em">KEY MESSAGE</text>
    <text x="860" y="75" font-family="Pretendard, sans-serif" font-weight="400" font-size="22" fill="#E4E4E7" text-anchor="middle">런칭 성공 → AI로 운영 효율화 → 인간 중심 의사결정 유지</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#18181B" stroke-width="1"/>
  <text x="100" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#71717A">MONTHLY REPORT · 2026 H1</text>
  <text x="1820" y="1040" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#71717A" text-anchor="end">PALETTE COMPARISON</text>
</svg>
