# 슬라이드 구조 문서
# 생성: 콘텐츠 설계 에이전트 (/pt-content)

메타정보:
  총_슬라이드_수: 5
  예상_발표_시간: "5분"
  스토리_구조: "Minto Pyramid + SCQA"
  슬라이드당_시간: "60초"

스토리_설계:
  # SCQA Framework
  Situation: "2026년 상반기 두 가지 핵심 목표가 있음"
  Complication: "런칭과 운영 효율화를 동시에 달성해야 함"
  Question: "어떻게 Q1 런칭 후 Q2 AI 운영 체계로 전환할 것인가?"
  Answer: "단계적 접근 - 런칭 → AI Agent 도입 → Human-in-the-Loop"

  # Pyramid Structure (결론 먼저)
  핵심_결론: "런칭 성공 → AI 운영 효율화 → 인간 중심 의사결정 유지"
  근거_1: "Q1 글로벌 런칭으로 시장 진입"
  근거_2: "Q2 AI Agent로 운영 자동화"
  근거_3: "Human-in-the-Loop로 리스크 관리"

슬라이드_목록:
  - 번호: 1
    유형: title
    섹션: "도입"
    제목: "런칭 → 운영 체계 구축"
    부제: "Q1 글로벌 서비스 출시 · Q2 AI 기반 효율화"
    핵심_메시지: "2026 H1의 두 가지 핵심 목표를 한눈에"
    시각_요소: "Q1/Q2 2단 구성, 화살표로 흐름 표현"
    발표자_노트: |
      안녕하세요. 2026년 상반기 핵심 계획을 공유드립니다.
      Q1에는 서비스 런칭, Q2에는 AI 운영 체계 구축이 목표입니다.
      결론부터 말씀드리면, 런칭 성공 후 AI로 효율화하되
      인간 중심 의사결정은 유지하겠습니다.

  - 번호: 2
    유형: content
    섹션: "Q1 계획"
    제목: "Q1: 글로벌 런칭"
    내용:
      - "SUPERSTAR THEBLACKLABEL"
      - "글로벌 동시 출시"
      - "3월 목표"
    핵심_메시지: "Q1은 서비스 런칭에 집중"
    시각_요소: "타임라인 또는 마일스톤 표현"
    발표자_노트: |
      Q1의 최우선 과제는 SUPERSTAR THEBLACKLABEL 런칭입니다.
      3월 글로벌 동시 출시를 목표로 준비 중입니다.
      런칭이 안정화되면 Q2 AI 체계로 전환합니다.

  - 번호: 3
    유형: content
    섹션: "Q2 계획"
    제목: "Q2: AI 운영 체계"
    내용:
      - "AI Agent 조직 모델 도입"
      - "운영 업무 자동화"
      - "6월 체계 구축 완료"
    핵심_메시지: "Q2는 AI로 운영 효율화"
    시각_요소: "AI Agent 구조도"
    발표자_노트: |
      Q2에는 AI Agent 기반 운영 체계를 구축합니다.
      반복적인 운영 업무를 자동화하여 효율을 높이고,
      팀은 창의적인 의사결정에 집중할 수 있게 됩니다.

  - 번호: 4
    유형: content
    섹션: "핵심 원칙"
    제목: "Human-in-the-Loop"
    내용:
      - "AI 제안 → 인간 검토 → 최종 결정"
      - "핵심 의사결정은 사람이 담당"
      - "AI는 보조 역할"
    핵심_메시지: "자동화하되 통제권은 유지"
    시각_요소: "순환 다이어그램 (AI ↔ Human)"
    발표자_노트: |
      중요한 원칙은 Human-in-the-Loop입니다.
      AI가 제안하고, 사람이 검토해서 최종 결정합니다.
      자동화의 효율성과 인간 판단의 안전성을 모두 확보합니다.

  - 번호: 5
    유형: cta
    섹션: "결론"
    제목: "리스크 관리 & 다음 단계"
    내용:
      - "런칭 리스크: 품질 검증 강화"
      - "AI 리스크: 단계적 도입"
      - "다음 단계: 3월 런칭 D-day"
    핵심_메시지: "리스크를 인지하고 대응 중"
    시각_요소: "리스크 매트릭스 또는 체크리스트"
    발표자_노트: |
      마지막으로 리스크 관리입니다.
      런칭 품질과 AI 도입 속도 모두 신중하게 관리 중입니다.
      3월 런칭을 목표로 최종 준비에 들어갑니다.
      질문 있으시면 말씀해주세요.
