<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">2026 H1 ROADMAP</text>

  <!-- Q2 Badge -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="80" height="40" fill="#333333" rx="4"/>
    <text x="40" y="28" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">Q2</text>
  </g>

  <!-- Main Title -->
  <text x="200" y="172" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF">AI Operations</text>
  <text x="100" y="230" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#B0B0B0">6월 목표 · AI Agent 조직 운영 모델 구축</text>

  <!-- Divider -->
  <line x1="100" y1="280" x2="1820" y2="280" stroke="#333333" stroke-width="1"/>

  <!-- 3 Cards Layout -->
  <!-- Card 1: AI Agent 조직 -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#444444" stroke-width="2"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">◈</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">AI AGENT ORG</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MULTI-AGENT SYSTEM</text>

    <!-- Content -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">AI Agent 조직</text>
    <text x="40" y="175" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">운영 모델</text>

    <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">Claude Code 기반</text>
    <text x="40" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">멀티 에이전트 시스템</text>

    <!-- Divider -->
    <line x1="40" y1="290" x2="500" y2="290" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 업무별 특화 에이전트</text>
    <text x="40" y="370" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 자동화 워크플로우 구축</text>
    <text x="40" y="400" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 조직 효율성 향상 목표</text>

    <!-- Tags -->
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="120" height="32" fill="#1A1A1A" rx="4"/>
      <text x="60" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">CLAUDE CODE</text>

      <rect x="130" y="0" width="100" height="32" fill="#1A1A1A" rx="4"/>
      <text x="180" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">WORKFLOW</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="120" height="36" fill="#333333" rx="18"/>
      <text x="60" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#FFFFFF" text-anchor="middle">◉ PLANNING</text>
    </g>
  </g>

  <!-- Card 2: Human-in-the-loop -->
  <g transform="translate(690, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">◎</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">HUMAN-IN-THE-LOOP</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">SUPERVISION MODEL</text>

    <!-- Content -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">인간 중심 감독</text>
    <text x="40" y="175" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">+ AI 실행 체계</text>

    <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">의사결정은 인간</text>
    <text x="40" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">실행은 AI</text>

    <!-- Divider -->
    <line x1="40" y1="290" x2="500" y2="290" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 인간이 방향 설정</text>
    <text x="40" y="370" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• AI가 실행 및 초안 생성</text>
    <text x="40" y="400" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 인간이 최종 검토/승인</text>

    <!-- Tags -->
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="90" height="32" fill="#1A1A1A" rx="4"/>
      <text x="45" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">DECIDE</text>

      <rect x="100" y="0" width="90" height="32" fill="#1A1A1A" rx="4"/>
      <text x="145" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">EXECUTE</text>

      <rect x="200" y="0" width="90" height="32" fill="#1A1A1A" rx="4"/>
      <text x="245" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">APPROVE</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="120" height="36" fill="#222222" rx="18"/>
      <text x="60" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">○ PLANNING</text>
    </g>
  </g>

  <!-- Card 3: 리스크 최소화 (v3: Risk Zero 표현 수정) -->
  <g transform="translate(1280, 320)">
    <rect x="0" y="0" width="540" height="580" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="540" height="80" fill="#1A1A1A" rx="12"/>
    <rect x="0" y="40" width="540" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">◆</text>
    <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="18" fill="#FFFFFF">LOW RISK</text>
    <text x="90" y="72" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">CONTINUITY DESIGN</text>

    <!-- Content (v3: 절대 표현 제거) -->
    <text x="40" y="140" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">AI 중단 시에도</text>
    <text x="40" y="175" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">운영 연속성 유지</text>

    <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">리스크 최소화 설계</text>
    <text x="40" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">기존 인력 프로세스 유지</text>

    <!-- Divider -->
    <line x1="40" y1="290" x2="500" y2="290" stroke="#222222" stroke-width="1"/>

    <!-- Key Points -->
    <text x="40" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 인간 기반 프로세스 유지</text>
    <text x="40" y="370" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• AI는 효율 향상 도구</text>
    <text x="40" y="400" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 핵심 역량 대체 아님</text>

    <!-- Tags -->
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="100" height="32" fill="#1A1A1A" rx="4"/>
      <text x="50" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">FALLBACK</text>

      <rect x="110" y="0" width="100" height="32" fill="#1A1A1A" rx="4"/>
      <text x="160" y="22" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">LEVERAGE</text>
    </g>

    <!-- Status -->
    <g transform="translate(40, 510)">
      <rect x="0" y="0" width="120" height="36" fill="#222222" rx="18"/>
      <text x="60" y="24" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">○ PLANNING</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MONTHLY REPORT · 2026 H1 ROADMAP</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="end">2 / 5</text>
</svg>
