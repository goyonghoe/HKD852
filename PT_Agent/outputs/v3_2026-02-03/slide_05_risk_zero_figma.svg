<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">AI OPERATIONS FRAMEWORK</text>

  <!-- Main Title (v3: 절대 표현 제거) -->
  <text x="100" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="56" fill="#FFFFFF">리스크 최소화 설계</text>
  <text x="100" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="24" fill="#B0B0B0">AI 없이도 운영 가능, AI 있으면 효율 향상</text>

  <!-- Divider -->
  <line x1="100" y1="300" x2="1820" y2="300" stroke="#333333" stroke-width="1"/>

  <!-- Two Card Layout -->
  <g transform="translate(100, 360)">

    <!-- Card 1: AI 중단 시 (Fallback) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="800" height="520" fill="#111111" rx="16" stroke="#222222" stroke-width="1"/>

      <!-- Header -->
      <rect x="0" y="0" width="800" height="80" fill="#1A1A1A" rx="16"/>
      <rect x="0" y="40" width="800" height="40" fill="#1A1A1A"/>

      <!-- Header Content -->
      <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">○</text>
      <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">AI 중단 시</text>

      <rect x="660" y="20" width="120" height="40" fill="#222222" rx="20"/>
      <text x="720" y="46" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#A0A0A0" text-anchor="middle">FALLBACK</text>

      <!-- Main Message (v3: 검증 가능한 표현) -->
      <text x="400" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="36" fill="#FFFFFF" text-anchor="middle">기존 인력 운영 유지</text>

      <!-- Sub Message -->
      <text x="400" y="240" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC" text-anchor="middle">모든 프로세스는 인간 기준 설계</text>

      <!-- Divider -->
      <line x1="60" y1="290" x2="740" y2="290" stroke="#222222" stroke-width="1"/>

      <!-- Key Points (v3: 과장 없는 표현) -->
      <g transform="translate(60, 330)">
        <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  AI는 효율 향상 도구</text>
        <text x="0" y="40" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  핵심 역량 대체 아님</text>
        <text x="0" y="80" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  기존 워크플로우 유지</text>
        <text x="0" y="120" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  인력 역할 변화 없음</text>
      </g>

      <!-- Visual Element -->
      <g transform="translate(550, 330)">
        <rect x="0" y="0" width="180" height="140" fill="#1A1A1A" rx="8"/>
        <text x="90" y="65" font-family="Noto Sans KR, sans-serif" font-size="48" fill="#CCCCCC" text-anchor="middle">●</text>
        <text x="90" y="105" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999" text-anchor="middle">HUMAN</text>
        <text x="90" y="125" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999" text-anchor="middle">OPERATED</text>
      </g>
    </g>

    <!-- VS Indicator -->
    <g transform="translate(830, 220)">
      <rect x="0" y="0" width="60" height="60" fill="#1A1A1A" rx="30"/>
      <text x="30" y="40" font-family="Space Mono, monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">VS</text>
    </g>

    <!-- Card 2: AI 작동 시 (Leverage) -->
    <g transform="translate(920, 0)">
      <rect x="0" y="0" width="800" height="520" fill="#111111" rx="16" stroke="#444444" stroke-width="2"/>

      <!-- Header -->
      <rect x="0" y="0" width="800" height="80" fill="#1A1A1A" rx="16"/>
      <rect x="0" y="40" width="800" height="40" fill="#1A1A1A"/>

      <!-- Header Content -->
      <text x="40" y="52" font-family="Noto Sans KR, sans-serif" font-size="32" fill="#FFFFFF">◉</text>
      <text x="90" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">AI 작동 시</text>

      <rect x="650" y="20" width="130" height="40" fill="#333333" rx="20"/>
      <text x="715" y="46" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#FFFFFF" text-anchor="middle">LEVERAGE</text>

      <!-- Main Message (v3: 검증 가능한 표현으로 수정) -->
      <text x="400" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="36" fill="#FFFFFF" text-anchor="middle">효율 향상 기대</text>

      <!-- Sub Message (v3: 외부 데이터 삭제) -->
      <text x="400" y="240" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC" text-anchor="middle">AI 활용으로 업무 속도 개선</text>

      <!-- Divider -->
      <line x1="60" y1="290" x2="740" y2="290" stroke="#333333" stroke-width="1"/>

      <!-- Key Points (v3: 검증 가능한 표현) -->
      <g transform="translate(60, 330)">
        <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  반복 작업 자동화 가능</text>
        <text x="0" y="40" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  초안 생성 시간 단축</text>
        <text x="0" y="80" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  야간/주말 작업 대응</text>
        <text x="0" y="120" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#A0A0A0">•  일관된 품질 유지 지원</text>
      </g>

      <!-- Visual Element -->
      <g transform="translate(550, 330)">
        <rect x="0" y="0" width="180" height="140" fill="#222222" rx="8" stroke="#333333" stroke-width="1"/>
        <text x="90" y="65" font-family="Noto Sans KR, sans-serif" font-size="48" fill="#FFFFFF" text-anchor="middle">◈</text>
        <text x="90" y="105" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#CCCCCC" text-anchor="middle">AI</text>
        <text x="90" y="125" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#CCCCCC" text-anchor="middle">ENHANCED</text>
      </g>
    </g>

  </g>

  <!-- Bottom Key Message (v3: 검증 가능한 표현) -->
  <g transform="translate(100, 920)">
    <text x="860" y="28" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#B0B0B0" text-anchor="middle">AI 도입은 선택지 확장 · 기존 운영 방식 유지</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MONTHLY REPORT · AI OPERATIONS</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="end">5 / 5</text>
</svg>
