  <!-- Bottom Key Message -->
  <g transform="translate(100, 860)">
    <rect x="0" y="0" width="1720" height="60" fill="#111111" rx="8" stroke="#222222" stroke-width="1"/>
    <text x="860" y="40" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">각 에이전트는 Claude Code 기반 · 인간 감독 하에 순차 실행</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MONTHLY REPORT · AI OPERATIONS</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="end">4 / 5</text>
</svg>
