        <text x="30" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">INTENT</text>
        <rect x="70" y="0" width="50" height="28" fill="#1A1A1A" rx="4"/>
        <text x="95" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">LIVE</text>
