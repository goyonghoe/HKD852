      <!-- Description -->
      <text x="150" y="230" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">데이터 검증</text>
      <text x="150" y="260" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">무결성 보장</text>

      <!-- Tasks -->
      <text x="30" y="310" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 오류/일관성 체크</text>
      <text x="30" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 품질 보증</text>

      <!-- Tags -->
      <g transform="translate(30, 390)">
        <rect x="0" y="0" width="60" height="28" fill="#1A1A1A" rx="4"/>
        <text x="30" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">CHECK</text>
        <rect x="70" y="0" width="60" height="28" fill="#1A1A1A" rx="4"/>
        <text x="100" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">VERIFY</text>
      </g>
    </g>

    <!-- Arrow 4 -->
    <text x="1383" y="240" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="28" fill="#B0B0B0">→</text>

    <!-- Agent 5: Dept. Liaison -->
    <g transform="translate(1420, 0)">
      <rect x="0" y="0" width="300" height="450" fill="#111111" rx="12" stroke="#444444" stroke-width="2"/>

      <!-- Number Badge -->
      <circle cx="40" cy="40" r="24" fill="#333333" stroke="#444444" stroke-width="1"/>
      <text x="40" y="48" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">5</text>

      <!-- Icon -->
      <text x="150" y="110" font-family="Noto Sans KR, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle">★</text>

      <!-- Title -->
      <text x="150" y="165" font-family="Space Mono, monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Dept. Liaison</text>

      <!-- Divider -->
      <line x1="30" y1="190" x2="270" y2="190" stroke="#333333" stroke-width="1"/>

      <!-- Description -->
      <text x="150" y="230" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">부서별</text>
      <text x="150" y="260" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">맞춤 소통</text>

      <!-- Tasks -->
      <text x="30" y="310" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 부서 전달/포맷 변환</text>
      <text x="30" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 커뮤니케이션</text>

      <!-- Tags -->
      <g transform="translate(30, 390)">
        <rect x="0" y="0" width="40" height="28" fill="#1A1A1A" rx="4"/>
        <text x="20" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">IP</text>
        <rect x="48" y="0" width="40" height="28" fill="#1A1A1A" rx="4"/>
        <text x="68" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">UI</text>
        <rect x="96" y="0" width="40" height="28" fill="#1A1A1A" rx="4"/>
        <text x="116" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">QA</text>
        <rect x="144" y="0" width="40" height="28" fill="#1A1A1A" rx="4"/>
        <text x="164" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">Art</text>
      </g>
