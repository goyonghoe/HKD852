<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">AI OPERATIONS FRAMEWORK</text>

  <!-- Main Title -->
  <text x="100" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="56" fill="#FFFFFF">5 Specialized Agents</text>
  <text x="100" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="24" fill="#B0B0B0">업무별 특화 에이전트가 순차적으로 협업</text>

  <!-- Divider -->
  <line x1="100" y1="300" x2="1820" y2="300" stroke="#333333" stroke-width="1"/>

  <!-- 5 Agent Cards (v2: 높이 축소, 간결화) -->
  <!-- 카드 폭 300px, 간격 55px -->
  <!-- 총 폭: 300×5 + 55×4 = 1720px (100px ~ 1820px) -->

  <g transform="translate(100, 350)">

    <!-- Agent 1: Game Design -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="450" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

      <!-- Number Badge -->
      <circle cx="40" cy="40" r="24" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
      <text x="40" y="48" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">1</text>

      <!-- Icon -->
      <text x="150" y="110" font-family="Noto Sans KR, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle">◇</text>

      <!-- Title -->
      <text x="150" y="165" font-family="Space Mono, monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Game Design</text>

      <!-- Divider -->
      <line x1="30" y1="190" x2="270" y2="190" stroke="#222222" stroke-width="1"/>

      <!-- Description -->
      <text x="150" y="230" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">게임 디자인</text>
      <text x="150" y="260" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">의사결정</text>

      <!-- Tasks (간소화) -->
      <text x="30" y="310" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 스펙 문서 작성</text>
      <text x="30" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 기획 검토/피드백</text>

      <!-- Tags -->
      <g transform="translate(30, 390)">
        <rect x="0" y="0" width="70" height="28" fill="#1A1A1A" rx="4"/>
        <text x="35" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">DESIGN</text>
        <rect x="80" y="0" width="55" height="28" fill="#1A1A1A" rx="4"/>
        <text x="107" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">DOCS</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <text x="318" y="240" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="28" fill="#B0B0B0">→</text>

    <!-- Agent 2: Data Management -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="300" height="450" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

      <!-- Number Badge -->
      <circle cx="40" cy="40" r="24" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
      <text x="40" y="48" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">2</text>

      <!-- Icon -->
      <text x="150" y="110" font-family="Noto Sans KR, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle">◈</text>

      <!-- Title -->
      <text x="150" y="165" font-family="Space Mono, monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Data Mgmt</text>

      <!-- Divider -->
      <line x1="30" y1="190" x2="270" y2="190" stroke="#222222" stroke-width="1"/>

      <!-- Description -->
      <text x="150" y="230" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">데이터 구조</text>
      <text x="150" y="260" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#CCCCCC" text-anchor="middle">생성</text>

      <!-- Tasks -->
      <text x="30" y="310" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 스키마 설계</text>
      <text x="30" y="340" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">• 테스트 데이터 생성</text>

      <!-- Tags -->
      <g transform="translate(30, 390)">
        <rect x="0" y="0" width="70" height="28" fill="#1A1A1A" rx="4"/>
        <text x="35" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">SCHEMA</text>
        <rect x="80" y="0" width="55" height="28" fill="#1A1A1A" rx="4"/>
        <text x="107" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="11" fill="#999999" text-anchor="middle">TEST</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <text x="673" y="240" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="28" fill="#B0B0B0">→</text>

    <!-- Agent 3: Balancing -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="300" height="450" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

      <!-- Number Badge -->
      <circle cx="40" cy="40" r="24" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
      <text x="40" y="48" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">3</text>

