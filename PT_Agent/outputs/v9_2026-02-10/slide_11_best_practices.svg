<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F2E;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0F0720;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="1600" cy="800" r="300" fill="#8B5CF6" opacity="0.03"/>
  <circle cx="300" cy="200" r="200" fill="#A78BFA" opacity="0.02"/>

  <!-- Section header -->
  <rect x="100" y="80" width="80" height="4" rx="2" fill="#8B5CF6"/>
  <text x="100" y="130" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="20" fill="#A78BFA" letter-spacing="3">SECTION 12 &amp; 13</text>
  <text x="100" y="190" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="48" fill="#FAF5FF">베스트 프랙티스 &amp; Q&amp;A</text>

  <!-- Do's -->
  <text x="100" y="280" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#10B981">DO — 꼭 지키세요</text>

  <rect x="100" y="300" width="830" height="310" rx="16" fill="#10B981" opacity="0.05" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>

  <text x="140" y="340" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">1. 작업 시작 전 항상 Update</text>
  <text x="160" y="368" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">최신 변경사항을 받아야 충돌을 최소화할 수 있습니다</text>

  <text x="140" y="405" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">2. 작은 단위로 자주 Checkin</text>
  <text x="160" y="433" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">"기능 A 구현 완료", "버그 B 수정" — 의미 있는 단위로</text>

  <text x="140" y="470" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">3. 의미 있는 코멘트 작성</text>
  <text x="160" y="498" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">"수정함" (X) → "인벤토리 슬롯 드래그 버그 수정 (#1234)" (O)</text>

  <text x="140" y="535" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">4. 씬/프리팹은 반드시 Lock 후 작업</text>
  <text x="160" y="563" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">바이너리 파일은 머지 불가 → Lock으로 충돌 원천 차단</text>

  <!-- Don'ts -->
  <text x="990" y="280" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#EF4444">DON'T — 피하세요</text>

  <rect x="990" y="300" width="830" height="310" rx="16" fill="#EF4444" opacity="0.05" stroke="#EF4444" stroke-width="1" stroke-opacity="0.2"/>

  <text x="1030" y="340" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">1. 오랫동안 Checkin 없이 작업</text>
  <text x="1050" y="368" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">일주일치 변경을 한 번에 → 대규모 충돌 위험</text>

  <text x="1030" y="405" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">2. Library/ 폴더를 버전 관리에 포함</text>
  <text x="1050" y="433" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">자동 생성 폴더 → ignore.conf에 반드시 추가</text>

  <text x="1030" y="470" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">3. Lock을 장기간 유지</text>
  <text x="1050" y="498" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">작업 완료 후 즉시 Unlock → 팀원 작업 차단 방지</text>

  <text x="1030" y="535" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">4. 빌드 깨진 상태로 Checkin</text>
  <text x="1050" y="563" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">Checkin 전 빌드 확인 → 팀 전체에 영향</text>

  <!-- Resources -->
  <text x="100" y="680" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#C4B5FD">참고 자료</text>

  <rect x="100" y="710" width="550" height="70" rx="12" fill="#2D1B4E" opacity="0.4"/>
  <text x="140" y="745" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="18" fill="#A78BFA">Unity Learn</text>
  <text x="140" y="768" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#C4B5FD" opacity="0.7">learn.unity.com — Plastic SCM 튜토리얼</text>

  <rect x="690" y="710" width="550" height="70" rx="12" fill="#2D1B4E" opacity="0.4"/>
  <text x="730" y="745" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="18" fill="#A78BFA">공식 문서</text>
  <text x="730" y="768" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#C4B5FD" opacity="0.7">docs.unity.com — Unity Version Control Manual</text>

  <rect x="1280" y="710" width="540" height="70" rx="12" fill="#2D1B4E" opacity="0.4"/>
  <text x="1320" y="745" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="18" fill="#A78BFA">Plastic SCM Book</text>
  <text x="1320" y="768" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#C4B5FD" opacity="0.7">docs.plasticscm.com/book — 심화 학습</text>

  <!-- Q&A section -->
  <rect x="100" y="810" width="1720" height="120" rx="20" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="960" y="860" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="36" fill="#FAF5FF" text-anchor="middle">Q &amp; A</text>
  <text x="960" y="900" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="20" fill="#C4B5FD" text-anchor="middle">궁금한 점이 있으시면 질문해주세요!</text>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <text x="100" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5">Plastic SCM 입사자 교육</text>
  <text x="1820" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5" text-anchor="end">13 / 13</text>
</svg>