  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0F0720; font-family: Inter, Pretendard, -apple-system, sans-serif; }

    /* Presentation mode */
    #presentation { width: 100%; height: 100%; position: relative; }

    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .slide svg {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Slide counter */
    #counter {
      position: fixed;
      bottom: 16px;
      right: 24px;
      color: #A78BFA;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.7;
      z-index: 100;
      pointer-events: none;
      letter-spacing: 1px;
    }

    /* Navigation hints */
    #nav-hint {
      position: fixed;
      bottom: 16px;
      left: 24px;
      color: #A78BFA;
      font-size: 12px;
      opacity: 0.4;
      z-index: 100;
      pointer-events: none;
    }

    /* Grid view */
    #grid-view {
      display: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 40px;
      background: #0F0720;
    }
    #grid-view.active {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      align-content: start;
    }
    .grid-item {
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
      background: #1A0F2E;
    }
    .grid-item:hover {
      border-color: #8B5CF6;
      transform: scale(1.03);
    }
    .grid-item.current {
      border-color: #8B5CF6;
    }
    .grid-item svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .grid-label {
      padding: 10px 14px;
      color: #C4B5FD;
      font-size: 13px;
      font-weight: 500;
      background: #2D1B4E;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-label .num {
      color: #8B5CF6;
      font-weight: 700;
      font-size: 14px;
    }

    /* Hide elements in grid mode */
    body.grid-mode #presentation { display: none; }
    body.grid-mode #counter { display: none; }
    body.grid-mode #nav-hint { display: none; }
  </style>

  <script>
    const TOTAL = 13;
    const slideTitles = [
      "Title",
      "목차",
      "버전 관리, 왜 필요한가?",
      "Plastic SCM 소개",
      "설치 및 초기 설정",
      "핵심 워크플로우",
      "Classic vs Gluon",
      "브랜치 전략",
      "머지와 충돌 해결",
      "테스트 전략과 VCS",
      "마이그레이션 가이드",
      "Unity 에디터 연동",
      "베스트 프랙티스 & Q&A"
    ];

    let current = 1;
    let gridMode = false;

    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('counter');
    const gridView = document.getElementById('grid-view');

    function showSlide(n) {
      if (n < 1) n = 1;
      if (n > TOTAL) n = TOTAL;
      current = n;
      slides.forEach((s, i) => {
        s.classList.toggle('active', i === n - 1);
      });
      counter.textContent = current + ' / ' + TOTAL;
    }

    function nextSlide() { showSlide(current + 1); }
    function prevSlide() { showSlide(current - 1); }

    function buildGrid() {
      gridView.innerHTML = '';
      slides.forEach((slide, i) => {
        const item = document.createElement('div');
        item.className = 'grid-item' + (i === current - 1 ? ' current' : '');
        
        const svgClone = slide.querySelector('svg').cloneNode(true);
        item.appendChild(svgClone);
        
        const label = document.createElement('div');
        label.className = 'grid-label';
        label.innerHTML = '<span class="num">' + String(i + 1).padStart(2, '0') + '</span><span>' + slideTitles[i] + '</span>';
        item.appendChild(label);
        
        item.addEventListener('click', () => {
          current = i + 1;
          toggleGrid();
          showSlide(current);
        });
        
        gridView.appendChild(item);
      });
    }

    function toggleGrid() {
      gridMode = !gridMode;
      document.body.classList.toggle('grid-mode', gridMode);
      if (gridMode) {
        buildGrid();
        gridView.classList.add('active');
      } else {
        gridView.classList.remove('active');
        showSlide(current);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (gridMode && e.key !== 'g' && e.key !== 'G' && e.key !== 'Escape') return;
      
      switch(e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
        case ' ':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          e.preventDefault();
          prevSlide();
          break;
        case 'Home':
          e.preventDefault();
          showSlide(1);
          break;
        case 'End':
          e.preventDefault();
          showSlide(TOTAL);
          break;
        case 'g':
        case 'G':
          e.preventDefault();
          toggleGrid();
          break;
        case 'f':
        case 'F':
          e.preventDefault();
          toggleFullscreen();
          break;
        case 'Escape':
          if (gridMode) {
            e.preventDefault();
            toggleGrid();
          }
          break;
      }
    });

    // Touch/swipe support
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (gridMode) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const dt = Date.now() - touchStartTime;
      
      if (dt > 500) return; // too slow
      if (Math.abs(dx) < 50) return; // too short
      if (Math.abs(dy) > Math.abs(dx)) return; // vertical swipe
      
      if (dx < 0) nextSlide();
      else prevSlide();
    }, { passive: true });

    // Click navigation (left/right halves)
    document.getElementById('presentation').addEventListener('click', (e) => {
      if (gridMode) return;
      const x = e.clientX / window.innerWidth;
      if (x > 0.5) nextSlide();
      else prevSlide();
    });

    // Initialize
    showSlide(1);
  </script>
</body>
</html>
