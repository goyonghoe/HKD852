    <text x="90" y="288" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">워크스페이스 · 리포지토리 · 조직 설정</text>

    <!-- Item 4 -->
    <rect x="0" y="330" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="368" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">04</text>
