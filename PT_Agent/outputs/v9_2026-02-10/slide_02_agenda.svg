  <text x="100" y="150" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="48" fill="#FAF5FF">목차</text>
  <text x="280" y="150" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="48" fill="#C4B5FD" opacity="0.5">Agenda</text>

