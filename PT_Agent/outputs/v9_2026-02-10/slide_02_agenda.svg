    <!-- Item 8 -->
    <rect x="0" y="220" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="258" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">08</text>
    <text x="90" y="258" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">테스트 전략</text>
    <text x="90" y="288" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">리그레션 · 스모크 테스트 · CI/CD</text>

    <!-- Item 9 -->
    <rect x="0" y="330" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="368" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">09</text>
    <text x="90" y="368" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">마이그레이션</text>
    <text x="90" y="398" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">Git/SVN에서 전환하기</text>

    <!-- Item 10 -->
    <rect x="0" y="440" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="478" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">10</text>
    <text x="90" y="478" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">Unity 연동 · 베스트 프랙티스 · Q&amp;A</text>
    <text x="90" y="508" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">에디터 연동 · 팀 규칙 · 학습 리소스</text>
  </g>

