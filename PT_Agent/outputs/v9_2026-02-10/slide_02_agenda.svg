    <rect x="0" y="440" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="478" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">05</text>
    <text x="90" y="478" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">Classic vs Gluon</text>
