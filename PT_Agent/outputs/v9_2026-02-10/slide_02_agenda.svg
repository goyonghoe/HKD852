    <rect x="0" y="0" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
    <text x="30" y="38" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">01</text>
    <text x="90" y="38" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">버전 관리, 왜 필요한가?</text>
    <text x="90" y="68" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">버전 관리 없는 개발의 위험성</text>

