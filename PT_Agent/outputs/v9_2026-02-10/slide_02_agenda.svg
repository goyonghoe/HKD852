    <text x="90" y="148" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="24" fill="#FAF5FF">Plastic SCM 소개</text>
    <text x="90" y="178" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7">Git과의 차이점, 게임 개발에 최적화된 이유</text>

    <!-- Item 3 -->
    <rect x="0" y="220" width="800" height="90" rx="12" fill="#2D1B4E" opacity="0.6"/>
