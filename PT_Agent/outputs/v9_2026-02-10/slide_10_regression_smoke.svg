<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F2E;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0F0720;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="1700" cy="300" r="280" fill="#8B5CF6" opacity="0.03"/>

  <!-- Section header -->
  <rect x="100" y="80" width="80" height="4" rx="2" fill="#8B5CF6"/>
  <text x="100" y="130" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="20" fill="#A78BFA" letter-spacing="3">SECTION 09</text>
  <text x="100" y="190" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="48" fill="#FAF5FF">테스트 전략과 VCS</text>
  <text x="100" y="235" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="22" fill="#C4B5FD" opacity="0.7">머지 전 테스트로 main 브랜치를 보호하는 전략</text>

  <!-- Workflow section title -->
  <text x="100" y="295" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="22" fill="#C4B5FD">머지 전 테스트 워크플로우 — 두 가지 접근</text>

  <!-- Case A: Direct test before merge -->
  <rect x="100" y="315" width="1720" height="95" rx="14" fill="#2D1B4E" opacity="0.25" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="100" y="315" width="6" height="95" rx="3" fill="#FBBF24"/>

  <text x="140" y="345" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="17" fill="#FBBF24">Case A</text>
  <text x="225" y="345" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="17" fill="#FAF5FF">직접 테스트 후 머지 — 빠르고 간단</text>

  <!-- Case A flow boxes -->
  <rect x="140" y="360" width="180" height="40" rx="8" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="230" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#FAF5FF" text-anchor="middle">Branch 작업 완료</text>

  <line x1="320" y1="380" x2="370" y2="380" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="366,375 376,380 366,385" fill="#8B5CF6" opacity="0.5"/>

  <rect x="376" y="360" width="200" height="40" rx="8" fill="#FBBF24" opacity="0.12" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="476" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#FBBF24" text-anchor="middle">Smoke Test</text>

  <line x1="576" y1="380" x2="626" y2="380" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="622,375 632,380 622,385" fill="#8B5CF6" opacity="0.5"/>

  <text x="650" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#10B981">Pass ✓</text>

  <line x1="700" y1="380" x2="750" y2="380" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="746,375 756,380 746,385" fill="#8B5CF6" opacity="0.5"/>

  <rect x="756" y="360" width="200" height="40" rx="8" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="856" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#10B981" text-anchor="middle">Merge to main</text>

  <line x1="956" y1="380" x2="1006" y2="380" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="1002,375 1012,380 1002,385" fill="#8B5CF6" opacity="0.5"/>

  <rect x="1012" y="360" width="220" height="40" rx="8" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="1"/>
  <text x="1122" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#EF4444" text-anchor="middle">Regression Test</text>

  <line x1="1232" y1="380" x2="1282" y2="380" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="1278,375 1288,380 1278,385" fill="#8B5CF6" opacity="0.5"/>

  <rect x="1288" y="360" width="160" height="40" rx="8" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1368" y="386" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#FAF5FF" text-anchor="middle">Release</text>

  <!-- Case B: Rebase then test -->
  <rect x="100" y="425" width="1720" height="105" rx="14" fill="#2D1B4E" opacity="0.25" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="100" y="425" width="6" height="105" rx="3" fill="#10B981"/>

  <text x="140" y="455" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="17" fill="#10B981">Case B</text>
  <text x="225" y="455" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="17" fill="#FAF5FF">리베이스 후 테스트 — main 최신 상태에서 검증 (권장)</text>

  <!-- Case B flow boxes -->
  <rect x="140" y="470" width="180" height="40" rx="8" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="230" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#FAF5FF" text-anchor="middle">Branch 작업 완료</text>

  <line x1="320" y1="490" x2="360" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="356,485 366,490 356,495" fill="#8B5CF6" opacity="0.5"/>

  <rect x="366" y="470" width="200" height="40" rx="8" fill="#A78BFA" opacity="0.15" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="466" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#A78BFA" text-anchor="middle">Rebase main</text>

  <line x1="566" y1="490" x2="606" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="602,485 612,490 602,495" fill="#8B5CF6" opacity="0.5"/>

  <rect x="612" y="470" width="200" height="40" rx="8" fill="#FBBF24" opacity="0.12" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="712" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#FBBF24" text-anchor="middle">Smoke Test</text>

  <line x1="812" y1="490" x2="852" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="848,485 858,490 848,495" fill="#8B5CF6" opacity="0.5"/>

  <text x="876" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#10B981">Pass ✓</text>

  <line x1="926" y1="490" x2="966" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="962,485 972,490 962,495" fill="#8B5CF6" opacity="0.5"/>

  <rect x="972" y="470" width="200" height="40" rx="8" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="1072" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="15" fill="#10B981" text-anchor="middle">Merge to main</text>

  <line x1="1172" y1="490" x2="1212" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="1208,485 1218,490 1208,495" fill="#8B5CF6" opacity="0.5"/>

  <rect x="1218" y="470" width="220" height="40" rx="8" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="1"/>
  <text x="1328" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#EF4444" text-anchor="middle">Regression Test</text>

  <line x1="1438" y1="490" x2="1478" y2="490" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="1474,485 1484,490 1474,495" fill="#8B5CF6" opacity="0.5"/>

  <rect x="1484" y="470" width="160" height="40" rx="8" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1564" y="496" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="15" fill="#FAF5FF" text-anchor="middle">Release</text>

  <!-- Case B advantage note -->
  <text x="140" y="525" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="14" fill="#C4B5FD" opacity="0.7">→ main의 최신 변경사항과 함께 테스트하므로, 머지 후 충돌이나 사이드이펙트를 사전에 발견할 수 있습니다</text>

  <!-- Smoke Test detail -->
  <rect x="100" y="550" width="860" height="260" rx="16" fill="#2D1B4E" opacity="0.4"/>
  <rect x="100" y="550" width="860" height="4" rx="2" fill="#FBBF24"/>

  <text x="140" y="595" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="26" fill="#FBBF24">Smoke Test (스모크 테스트)</text>
  <text x="140" y="628" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#FAF5FF">"빌딩에 연기가 나는지 확인하는" 최소한의 검증</text>

  <text x="140" y="668" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#C4B5FD">언제?</text>
  <text x="140" y="696" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• 머지 전, 브랜치에서 빌드 후 바로 실행</text>
  <text x="140" y="722" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• main 리베이스 후 테스트하면 더 안전</text>

  <text x="140" y="760" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#C4B5FD">무엇을?</text>
  <text x="140" y="788" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• 게임이 실행되는가? (크래시 없이 메인 화면 진입)</text>

  <!-- Regression Test detail -->
  <rect x="1000" y="550" width="820" height="260" rx="16" fill="#2D1B4E" opacity="0.4"/>
  <rect x="1000" y="550" width="820" height="4" rx="2" fill="#EF4444"/>

  <text x="1040" y="595" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="26" fill="#EF4444">Regression Test (리그레션 테스트)</text>
  <text x="1040" y="628" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#FAF5FF">"새 코드가 기존 기능을 망가뜨리지 않았는지" 검증</text>

  <text x="1040" y="668" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#C4B5FD">왜 중요한가?</text>
  <text x="1040" y="696" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• 인벤토리 수정 → 상점 결제가 깨질 수 있음</text>
  <text x="1040" y="722" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• UI 변경 → 다른 해상도에서 레이아웃 깨짐</text>

  <text x="1040" y="760" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#C4B5FD">Plastic SCM과의 연관</text>
  <text x="1040" y="788" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="17" fill="#C4B5FD" opacity="0.8">• Mergebot + CI/CD로 머지 전 자동 실행</text>

  <!-- Comparison table -->
  <text x="100" y="855" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="22" fill="#C4B5FD">비교 요약</text>

  <rect x="100" y="875" width="1720" height="38" rx="8" fill="#8B5CF6" opacity="0.2"/>
  <text x="440" y="900" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="17" fill="#FAF5FF" text-anchor="middle">항목</text>
  <text x="860" y="900" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="17" fill="#FBBF24" text-anchor="middle">Smoke Test</text>
  <text x="1380" y="900" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="17" fill="#EF4444" text-anchor="middle">Regression Test</text>

  <rect x="100" y="918" width="1720" height="33" fill="#2D1B4E" opacity="0.15"/>
  <text x="440" y="940" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#C4B5FD" text-anchor="middle">목적</text>
  <text x="860" y="940" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#FAF5FF" text-anchor="middle">"실행이 되나?" — 최소 동작 확인</text>
  <text x="1380" y="940" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#FAF5FF" text-anchor="middle">"기존 기능 괜찮나?" — 사이드이펙트 검출</text>

  <rect x="100" y="956" width="1720" height="33" fill="#2D1B4E" opacity="0.08"/>
  <text x="440" y="978" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#C4B5FD" text-anchor="middle">시점</text>
  <text x="860" y="978" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#FAF5FF" text-anchor="middle">머지 전 (브랜치에서 실행)</text>
  <text x="1380" y="978" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="15" fill="#FAF5FF" text-anchor="middle">머지 후 (전수 검사)</text>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <text x="100" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5">Plastic SCM 입사자 교육</text>
  <text x="1820" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5" text-anchor="end">10 / 13</text>
</svg>
