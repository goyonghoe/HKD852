<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F2E;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0F0720;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="1650" cy="250" r="350" fill="#8B5CF6" opacity="0.04"/>
  <circle cx="200" cy="850" r="250" fill="#A78BFA" opacity="0.03"/>
  <circle cx="1400" cy="800" r="180" fill="#6D28D9" opacity="0.05"/>

  <!-- Accent top line -->
  <rect x="100" y="80" width="120" height="4" rx="2" fill="#8B5CF6"/>

  <!-- Category label -->
  <text x="100" y="340" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="22" fill="#A78BFA" letter-spacing="4">ONBOARDING TRAINING</text>

  <!-- Main title -->
  <text x="100" y="430" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="72" fill="#FAF5FF">Plastic SCM</text>
  <text x="100" y="520" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="72" fill="#FAF5FF">입사자 교육</text>

  <!-- Subtitle -->
  <text x="100" y="600" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="28" fill="#C4B5FD">Unity Version Control — 게임 개발 팀을 위한 버전 관리 완전 가이드</text>

  <!-- Divider line -->
  <line x1="100" y1="660" x2="600" y2="660" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Meta info -->
  <text x="100" y="720" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="20" fill="#C4B5FD" opacity="0.7">대상: 신규 입사자 (프로그래머 &amp; 아티스트)</text>
  <text x="100" y="760" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="20" fill="#C4B5FD" opacity="0.7">예상 소요 시간: 약 30분</text>

  <!-- Version control icon representation -->
  <g transform="translate(1350, 400)" opacity="0.15">
    <circle cx="0" cy="0" r="12" fill="#8B5CF6"/>
    <circle cx="0" cy="80" r="12" fill="#8B5CF6"/>
    <circle cx="80" cy="40" r="12" fill="#A78BFA"/>
    <circle cx="80" cy="120" r="12" fill="#A78BFA"/>
    <circle cx="0" cy="160" r="12" fill="#8B5CF6"/>
    <line x1="0" y1="12" x2="0" y2="68" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="0" y1="92" x2="0" y2="148" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="12" y1="80" x2="68" y2="48" stroke="#A78BFA" stroke-width="2"/>
    <line x1="80" y1="52" x2="80" y2="108" stroke="#A78BFA" stroke-width="2"/>
    <line x1="68" y1="120" x2="12" y2="155" stroke="#A78BFA" stroke-width="2"/>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <text x="100" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5">Plastic SCM 입사자 교육</text>
  <text x="1820" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5" text-anchor="end">1 / 13</text>
</svg>