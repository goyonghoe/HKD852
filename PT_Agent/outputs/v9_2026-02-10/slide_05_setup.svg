<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F2E;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0F0720;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0F0720"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="150" cy="900" r="200" fill="#8B5CF6" opacity="0.03"/>

  <!-- Section header -->
  <rect x="100" y="80" width="80" height="4" rx="2" fill="#8B5CF6"/>
  <text x="100" y="130" font-family="Inter, Pretendard, sans-serif" font-weight="500" font-size="20" fill="#A78BFA" letter-spacing="3">SECTION 03</text>
  <text x="100" y="190" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="48" fill="#FAF5FF">설치 및 초기 설정</text>

  <!-- Step 1 -->
  <rect x="100" y="250" width="840" height="340" rx="16" fill="#2D1B4E" opacity="0.4"/>
  <rect x="100" y="250" width="6" height="340" rx="3" fill="#8B5CF6"/>

  <text x="140" y="300" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">Step 1. 설치</text>

  <text x="140" y="345" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">다운로드</text>
  <text x="140" y="375" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">plasticscm.com → 설치 마법사 실행</text>
  <text x="140" y="405" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">또는 Unity Hub → Package Manager에서 설치</text>

  <text x="140" y="450" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">계정 설정</text>
  <text x="140" y="480" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">Unity ID로 로그인 (SSO 지원)</text>
  <text x="140" y="510" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">사내 조직에 초대 받기 → 관리자에게 요청</text>

  <rect x="140" y="535" width="760" height="36" rx="8" fill="#8B5CF6" opacity="0.1"/>
  <text x="160" y="559" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#A78BFA">팁: 설치 후 첫 실행 시 Plastic 또는 Gluon 모드 선택 (나중에 변경 가능)</text>

  <!-- Step 2 -->
  <rect x="980" y="250" width="840" height="340" rx="16" fill="#2D1B4E" opacity="0.4"/>
  <rect x="980" y="250" width="6" height="340" rx="3" fill="#8B5CF6"/>

  <text x="1020" y="300" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="24" fill="#8B5CF6">Step 2. 워크스페이스 생성</text>

  <text x="1020" y="345" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">리포지토리 (Repository)</text>
  <text x="1020" y="375" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">프로젝트의 전체 변경 이력이 저장되는 곳</text>
  <text x="1020" y="405" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">Plastic Cloud 또는 사내 서버에 위치</text>

  <text x="1020" y="450" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#FAF5FF">워크스페이스 (Workspace)</text>
  <text x="1020" y="480" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">내 컴퓨터의 로컬 작업 폴더</text>
  <text x="1020" y="510" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.8">Unity 프로젝트 폴더 = 워크스페이스</text>

  <rect x="1020" y="535" width="760" height="36" rx="8" fill="#8B5CF6" opacity="0.1"/>
  <text x="1040" y="559" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#A78BFA">팁: 기존 프로젝트에 합류 시 → 리포지토리 선택 → 워크스페이스 자동 생성</text>

  <!-- Diagram: Repository ↔ Workspace -->
  <text x="100" y="660" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="22" fill="#C4B5FD">구조 이해</text>

  <!-- Cloud/Server box -->
  <rect x="200" y="700" width="500" height="220" rx="16" fill="#2D1B4E" opacity="0.3" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="450" y="740" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#A78BFA" text-anchor="middle">Plastic Cloud / 사내 서버</text>
  <rect x="280" y="760" width="340" height="60" rx="10" fill="#8B5CF6" opacity="0.15"/>
  <text x="450" y="798" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="22" fill="#FAF5FF" text-anchor="middle">Repository</text>
  <text x="450" y="850" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7" text-anchor="middle">전체 이력 · 브랜치 · 모든 버전</text>
  <text x="450" y="880" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7" text-anchor="middle">팀 전체가 공유</text>

  <!-- Arrows -->
  <line x1="700" y1="790" x2="850" y2="790" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
  <polygon points="845,783 860,790 845,797" fill="#8B5CF6" opacity="0.5"/>
  <text x="775" y="775" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">Update</text>

  <line x1="850" y1="830" x2="700" y2="830" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
  <polygon points="705,823 690,830 705,837" fill="#8B5CF6" opacity="0.5"/>
  <text x="775" y="855" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="14" fill="#A78BFA" text-anchor="middle">Checkin</text>

  <!-- Local boxes -->
  <rect x="860" y="700" width="460" height="220" rx="16" fill="#2D1B4E" opacity="0.3" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1090" y="740" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#A78BFA" text-anchor="middle">내 컴퓨터</text>
  <rect x="920" y="760" width="340" height="60" rx="10" fill="#A78BFA" opacity="0.15"/>
  <text x="1090" y="798" font-family="Inter, Pretendard, sans-serif" font-weight="700" font-size="22" fill="#FAF5FF" text-anchor="middle">Workspace</text>
  <text x="1090" y="850" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7" text-anchor="middle">로컬 작업 파일들</text>
  <text x="1090" y="880" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.7" text-anchor="middle">= Unity 프로젝트 폴더</text>

  <!-- Other team members -->
  <rect x="1400" y="700" width="420" height="220" rx="16" fill="#2D1B4E" opacity="0.2" stroke="#6D28D9" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1610" y="740" font-family="Inter, Pretendard, sans-serif" font-weight="600" font-size="20" fill="#6D28D9" text-anchor="middle">팀원들</text>
  <text x="1610" y="790" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.5" text-anchor="middle">각자의 Workspace</text>
  <text x="1610" y="820" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.5" text-anchor="middle">같은 Repository에 연결</text>
  <text x="1610" y="860" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="18" fill="#C4B5FD" opacity="0.5" text-anchor="middle">독립적으로 작업</text>

  <!-- Footer -->
  <line x1="100" y1="1000" x2="1820" y2="1000" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <text x="100" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5">Plastic SCM 입사자 교육</text>
  <text x="1820" y="1040" font-family="Inter, Pretendard, sans-serif" font-weight="400" font-size="16" fill="#C4B5FD" opacity="0.5" text-anchor="end">5 / 13</text>
</svg>