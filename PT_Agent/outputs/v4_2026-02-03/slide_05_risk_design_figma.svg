<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- v4: Minto Pyramid - 결론부터 -->
  <!-- Glance Test: "AI 없어도 운영 가능" 즉시 파악 -->
  <!-- 6x6: 간결한 비교 구조 -->

  <!-- Header -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#808080">RISK DESIGN</text>

  <!-- Main Title (결론) -->
  <text x="100" y="200" font-family="Space Mono, monospace" font-weight="700" font-size="56" fill="#FFFFFF">AI 없이도 운영 가능</text>
  <text x="100" y="270" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="28" fill="#B0B0B0">AI가 있으면 효율 향상 · 없어도 기존 방식으로 운영 유지</text>

  <!-- Divider -->
  <line x1="100" y1="340" x2="1820" y2="340" stroke="#333333" stroke-width="1"/>

  <!-- Two Column Comparison: Fallback vs Leverage -->
  <!-- 심플한 비교 구조 -->

  <!-- Left: AI 중단 시 (Fallback) -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="780" height="420" fill="#111111" rx="16" stroke="#333333" stroke-width="1"/>

    <!-- Header -->
    <rect x="0" y="0" width="780" height="80" fill="#1A1A1A" rx="16"/>
    <rect x="0" y="40" width="780" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Space Mono, monospace" font-size="28" fill="#FFFFFF">○</text>
    <text x="80" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="22" fill="#FFFFFF">AI 중단 시</text>
    <rect x="620" y="20" width="120" height="40" fill="#222222" rx="20"/>
    <text x="680" y="46" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">FALLBACK</text>

    <!-- 큰 숫자/메시지 -->
    <text x="390" y="200" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF" text-anchor="middle">기존 방식 유지</text>

    <!-- 핵심 포인트 (3개만) -->
    <text x="390" y="290" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#999999" text-anchor="middle">모든 프로세스는 인간 기준으로 설계됨</text>
    <text x="390" y="330" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#999999" text-anchor="middle">AI는 효율 향상 도구, 핵심 역량 대체 아님</text>
    <text x="390" y="370" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#999999" text-anchor="middle">기존 인력 역할 변화 없음</text>
  </g>

  <!-- Center: VS -->
  <g transform="translate(910, 580)">
    <rect x="0" y="0" width="80" height="80" fill="#1A1A1A" rx="40"/>
    <text x="40" y="50" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">VS</text>
  </g>

  <!-- Right: AI 작동 시 (Leverage) -->
  <g transform="translate(1040, 400)">
    <rect x="0" y="0" width="780" height="420" fill="#111111" rx="16" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="780" height="80" fill="#1A1A1A" rx="16"/>
    <rect x="0" y="40" width="780" height="40" fill="#1A1A1A"/>
    <text x="40" y="52" font-family="Space Mono, monospace" font-size="28" fill="#FFFFFF">◉</text>
    <text x="80" y="52" font-family="Space Mono, monospace" font-weight="700" font-size="22" fill="#FFFFFF">AI 작동 시</text>
    <rect x="610" y="20" width="130" height="40" fill="#333333" rx="20"/>
    <text x="675" y="46" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#FFFFFF" text-anchor="middle">LEVERAGE</text>

    <!-- 큰 숫자/메시지 -->
    <text x="390" y="200" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF" text-anchor="middle">효율 향상</text>

    <!-- 핵심 포인트 (3개만) -->
    <text x="390" y="290" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC" text-anchor="middle">반복 작업 자동화 가능</text>
    <text x="390" y="330" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC" text-anchor="middle">초안 생성 시간 단축</text>
    <text x="390" y="370" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC" text-anchor="middle">야간/주말 작업 대응 가능</text>
  </g>

  <!-- Bottom Key Message -->
  <g transform="translate(100, 870)">
    <text x="860" y="30" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="22" fill="#CCCCCC" text-anchor="middle">AI 도입 = 선택지 확장 · 기존 운영 방식은 그대로 유지</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#808080">MONTHLY REPORT · AI OPERATIONS</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#808080" text-anchor="end">5 / 5</text>
</svg>
