<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#808080">CORE PRINCIPLE</text>

  <!-- Title -->
  <text x="100" y="200" font-family="Space Mono, monospace" font-weight="700" font-size="64" fill="#FFFFFF">Human-in-the-Loop</text>
  <text x="100" y="260" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="28" fill="#B0B0B0">AI 효율 + 인간 통제</text>

  <!-- Divider -->
  <line x1="100" y1="320" x2="1820" y2="320" stroke="#333333" stroke-width="1"/>

  <!-- 3-Step Flow -->
  <g transform="translate(100, 420)">
    <!-- Step 1: AI 제안 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="480" height="280" fill="#111111" rx="16"/>
      <circle cx="60" cy="60" r="30" fill="#1a1a2e"/>
      <text x="60" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="120" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">AI 제안</text>
      <line x1="40" y1="100" x2="440" y2="100" stroke="#222222" stroke-width="1"/>
      <text x="40" y="150" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">데이터 분석</text>
      <text x="40" y="185" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">옵션 생성</text>
      <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">초안 작성</text>
      <rect x="40" y="240" width="100" height="28" fill="#333333" rx="14"/>
      <text x="90" y="259" font-family="Space Mono, monospace" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">AI 담당</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(520, 120)">
      <text x="0" y="20" font-family="Space Mono, monospace" font-size="48" fill="#444444">→</text>
    </g>

    <!-- Step 2: 인간 검토 -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="480" height="280" fill="#111111" rx="16"/>
      <circle cx="60" cy="60" r="30" fill="#1a1a2e"/>
      <text x="60" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="120" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">인간 검토</text>
      <line x1="40" y1="100" x2="440" y2="100" stroke="#222222" stroke-width="1"/>
      <text x="40" y="150" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">맥락 판단</text>
      <text x="40" y="185" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">품질 검증</text>
      <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">리스크 평가</text>
      <rect x="40" y="240" width="100" height="28" fill="#1a1a2e" rx="14"/>
      <text x="90" y="259" font-family="Space Mono, monospace" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">팀 담당</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(1140, 120)">
      <text x="0" y="20" font-family="Space Mono, monospace" font-size="48" fill="#444444">→</text>
    </g>

    <!-- Step 3: 최종 결정 -->
    <g transform="translate(1240, 0)">
      <rect x="0" y="0" width="480" height="280" fill="#111111" rx="16" stroke="#333333" stroke-width="2"/>
      <circle cx="60" cy="60" r="30" fill="#FFFFFF"/>
      <text x="60" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#0A0A0A" text-anchor="middle">3</text>
      <text x="120" y="68" font-family="Space Mono, monospace" font-weight="700" font-size="28" fill="#FFFFFF">최종 결정</text>
      <line x1="40" y1="100" x2="440" y2="100" stroke="#222222" stroke-width="1"/>
      <text x="40" y="150" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">책임 있는 승인</text>
      <text x="40" y="185" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">최종 판단</text>
      <text x="40" y="220" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="20" fill="#CCCCCC">실행 지시</text>
      <rect x="40" y="240" width="100" height="28" fill="#FFFFFF" rx="14"/>
      <text x="90" y="259" font-family="Space Mono, monospace" font-weight="700" font-size="12" fill="#0A0A0A" text-anchor="middle">사람 결정</text>
    </g>
  </g>

  <!-- Bottom Message -->
  <g transform="translate(100, 780)">
    <rect x="0" y="0" width="1720" height="90" fill="#111111" rx="12"/>
    <text x="860" y="55" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="24" fill="#FFFFFF" text-anchor="middle">핵심 의사결정은 <tspan fill="#B0B0B0">항상</tspan> 사람이 담당</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#808080">MONTHLY REPORT · 2026 H1</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#808080" text-anchor="end">4 / 5</text>
</svg>
