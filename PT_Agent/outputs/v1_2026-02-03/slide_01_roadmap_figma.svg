<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Section -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">2026 H1 ROADMAP</text>

  <!-- Main Title -->
  <text x="100" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF">App Launch</text>
  <text x="480" y="180" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="48" fill="#B0B0B0">→</text>
  <text x="540" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="48" fill="#FFFFFF">AI Operations Pipeline</text>

  <!-- Divider Line -->
  <line x1="100" y1="220" x2="1820" y2="220" stroke="#333333" stroke-width="1"/>

  <!-- Q1 Column -->
  <g transform="translate(100, 280)">
    <!-- Q1 Header -->
    <rect x="0" y="0" width="800" height="60" fill="#1A1A1A" rx="4"/>
    <text x="30" y="40" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">Q1</text>
    <text x="100" y="40" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#B0B0B0">3월 말 목표</text>
    <text x="280" y="40" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">SERVICE LAUNCH</text>

    <!-- Q1 Content Box -->
    <rect x="0" y="80" width="800" height="580" fill="#111111" rx="8" stroke="#222222" stroke-width="1"/>

    <!-- Item 1: SUPERSTAR -->
    <g transform="translate(40, 120)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">▶</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">SUPERSTAR THEBLACKLABEL</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">글로벌 런칭</text>
      <text x="50" y="55" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">K-Pop 리듬게임 · 글로벌 동시 출시</text>
    </g>

    <!-- Item 2: Live Ops -->
    <g transform="translate(40, 240)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">⚙</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">라이브 운영 인프라 안정화</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">서버 · 모니터링 · CS</text>
      <text x="50" y="55" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">24/7 안정적 서비스 운영 체계 구축</text>
    </g>

    <!-- Item 3: IP Pipeline -->
    <g transform="translate(40, 360)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">★</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">아티스트 IP 콘텐츠 파이프라인</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">콘텐츠 제작 체계 가동</text>

      <!-- Artist Tags -->
      <g transform="translate(50, 60)">
        <rect x="0" y="0" width="100" height="28" fill="#1A1A1A" rx="4"/>
        <text x="50" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">TAEYANG</text>

        <rect x="110" y="0" width="110" height="28" fill="#1A1A1A" rx="4"/>
        <text x="165" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">JEON SOMI</text>

        <rect x="230" y="0" width="80" height="28" fill="#1A1A1A" rx="4"/>
        <text x="270" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">MEOVV</text>

        <rect x="320" y="0" width="60" height="28" fill="#1A1A1A" rx="4"/>
        <text x="350" y="19" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">ADP</text>
      </g>
    </g>

    <!-- Q1 Status Badge -->
    <g transform="translate(600, 500)">
      <rect x="0" y="0" width="160" height="40" fill="#222222" rx="20"/>
      <text x="80" y="26" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999" text-anchor="middle">● EXECUTION</text>
    </g>
  </g>

  <!-- Arrow between columns -->
  <g transform="translate(930, 500)">
    <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="48" fill="#B0B0B0">→</text>
  </g>

  <!-- Q2 Column -->
  <g transform="translate(1020, 280)">
    <!-- Q2 Header -->
    <rect x="0" y="0" width="800" height="60" fill="#1A1A1A" rx="4"/>
    <text x="30" y="40" font-family="Space Mono, monospace" font-weight="700" font-size="24" fill="#FFFFFF">Q2</text>
    <text x="100" y="40" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="18" fill="#B0B0B0">6월 목표</text>
    <text x="280" y="40" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">AI OPERATIONS</text>

    <!-- Q2 Content Box -->
    <rect x="0" y="80" width="800" height="580" fill="#111111" rx="8" stroke="#444444" stroke-width="2"/>

    <!-- Item 1: AI Agent Org -->
    <g transform="translate(40, 120)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">◈</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">AI Agent 조직 운영 모델 구축</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">Claude Code 기반 멀티 에이전트</text>
      <text x="50" y="55" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">업무별 특화 에이전트 시스템 도입</text>
    </g>

    <!-- Item 2: Human-in-the-loop -->
    <g transform="translate(40, 240)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">◎</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">인간 중심 감독 + AI 실행 체계</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">Human-in-the-loop</text>
      <text x="50" y="55" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">의사결정은 인간, 실행은 AI</text>
    </g>

    <!-- Item 3: Risk Zero -->
    <g transform="translate(40, 360)">
      <text x="0" y="0" font-family="Noto Sans KR, sans-serif" font-size="28" fill="#FFFFFF">◆</text>
      <text x="50" y="0" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF">AI 중단 시에도 운영 연속성 확보</text>
      <text x="50" y="30" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="16" fill="#CCCCCC">리스크 제로 설계</text>
      <text x="50" y="55" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="14" fill="#A0A0A0">기존 인력 기반 프로세스 유지</text>
    </g>

    <!-- Q2 Status Badge -->
    <g transform="translate(600, 500)">
      <rect x="0" y="0" width="160" height="40" fill="#333333" rx="20"/>
      <text x="80" y="26" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#FFFFFF" text-anchor="middle">◉ PLANNING</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="100" y1="980" x2="1820" y2="980" stroke="#222222" stroke-width="1"/>
  <text x="100" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999">MONTHLY REPORT · 2026 H1 ROADMAP</text>
  <text x="1820" y="1020" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="end">1 / 2</text>
</svg>