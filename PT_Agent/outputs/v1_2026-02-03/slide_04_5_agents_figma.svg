<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Header Label -->
  <text x="100" y="100" font-family="Space Mono, monospace" font-weight="400" font-size="14" fill="#999999">AI OPERATIONS FRAMEWORK</text>

  <!-- Main Title -->
  <text x="100" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="56" fill="#FFFFFF">5 Specialized Agents</text>
  <text x="100" y="250" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="24" fill="#B0B0B0">업무별 특화 에이전트가 순차적으로 협업</text>

  <!-- Divider -->
  <line x1="100" y1="300" x2="1820" y2="300" stroke="#333333" stroke-width="1"/>

  <!-- 5 Agent Cards -->
  <!-- 카드 폭 300px, 간격 55px -->
  <!-- 총 폭: 300×5 + 55×4 = 1720px (100px ~ 1820px) -->

  <g transform="translate(100, 360)">

    <!-- Agent 1: Game Design -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="520" fill="#111111" rx="12" stroke="#222222" stroke-width="1"/>

      <!-- Number Badge -->
      <circle cx="40" cy="40" r="24" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
      <text x="40" y="48" font-family="Space Mono, monospace" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">1</text>

      <!-- Icon -->
      <text x="150" y="120" font-family="Noto Sans KR, sans-serif" font-size="48" fill="#FFFFFF" text-anchor="middle">◇</text>

      <!-- Title -->
      <text x="150" y="180" font-family="Space Mono, monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Game Design</text>
      <text x="150" y="205" font-family="Space Mono, monospace" font-weight="400" font-size="12" fill="#999999" text-anchor="middle">Agent</text>

      <!-- Divider -->
      <line x1="30" y1="230" x2="270" y2="230" stroke="#222222" stroke-width="1"/>

      <!-- Description -->
