      <text x="150" y="295" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="16" fill="#CCCCCC" text-anchor="middle">의사결정</text>

      <!-- Tasks -->
      <text x="30" y="350" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 문서 작성</text>
      <text x="30" y="375" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 스펙 정의</text>
      <text x="30" y="400" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 기획 검토</text>

      <!-- Tags -->
      <g transform="translate(30, 450)">
        <rect x="0" y="0" width="70" height="26" fill="#1A1A1A" rx="4"/>
        <text x="35" y="18" font-family="Space Mono, monospace" font-weight="400" font-size="10" fill="#999999" text-anchor="middle">DESIGN</text>
