        <text x="30" y="18" font-family="Space Mono, monospace" font-weight="400" font-size="10" fill="#999999" text-anchor="middle">CHECK</text>
        <rect x="70" y="0" width="60" height="26" fill="#1A1A1A" rx="4"/>
        <text x="100" y="18" font-family="Space Mono, monospace" font-weight="400" font-size="10" fill="#999999" text-anchor="middle">VERIFY</text>
