      <text x="150" y="295" font-family="Noto Sans KR, sans-serif" font-weight="500" font-size="16" fill="#CCCCCC" text-anchor="middle">맞춤 소통</text>

      <!-- Tasks -->
      <text x="30" y="350" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 부서 전달</text>
      <text x="30" y="375" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 포맷 변환</text>
      <text x="30" y="400" font-family="Noto Sans KR, sans-serif" font-weight="400" font-size="13" fill="#A0A0A0">• 커뮤니케이션</text>

      <!-- Tags -->
      <g transform="translate(30, 450)">
        <rect x="0" y="0" width="40" height="26" fill="#1A1A1A" rx="4"/>
        <text x="20" y="18" font-family="Space Mono, monospace" font-weight="400" font-size="10" fill="#999999" text-anchor="middle">IP</text>
        <rect x="48" y="0" width="40" height="26" fill="#1A1A1A" rx="4"/>
        <text x="68" y="18" font-family="Space Mono, monospace" font-weight="400" font-size="10" fill="#999999" text-anchor="middle">UI</text>
        <rect x="96" y="0" width="40" height="26" fill="#1A1A1A" rx="4"/>
