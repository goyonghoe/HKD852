revise_items:
  - field: "script.body[2]"
    issue: "'이미 창의성을 삼켰다' states AI autonomy as present-tense fact, risking AI misrepresentation"
    suggestion: |
      Soften the assertion to maintain hypothetical or hedged framing. Options:
      (a) "AI는 반복만 하던 게 아니다. 창의적인 영역까지 들어왔다."
         (States AI entered creative territory — factual — without claiming it consumed it)
      (b) "AI는 반복을 넘어 창의적인 결과물도 만들어낸다."
         (Focuses on output, not displacement)
      (c) "반복은 이미 끝났다. AI는 이제 창작 영역에 있다."
         (Factual positioning without swallowing metaphor)
      Key: avoid framing AI as having autonomously conquered creativity. State capability, not domination.

  - field: "script.body[1]"
    issue: "Vague benchmark claim — '코딩 벤치마크 1위' is unattributed and oversimplified"
    suggestion: |
      Minor fix — add specificity or hedge:
      (a) "AI 코딩 에이전트는 주요 코딩 벤치마크에서 1위를 찍었다." (adds '주요')
      (b) "AI 코딩 에이전트는 SWE-Bench에서 1위를 찍었다." (names the benchmark)
      (c) Keep as-is if the editorial decision is that Shorts don't require academic citation.
      This is a soft recommendation, not a blocker.

  - field: "script.hook"
    issue: "Spelling: '빼앗는다면' — carried over from v1 review"
    suggestion: |
      '빼앗다' is valid Korean (빼다 + 앗다 = to snatch away). However, the more common
      standard form used in broadcast/written Korean is '빼앗다' which may appear as a
      typo to viewers. Consider '빼앗는다면' vs '빼앗긴다면' vs '대체한다면'.
      This is cosmetic — not a scoring factor.

  - field: "rendering"
    issue: "Only 3/6 images rendered"
    suggestion: "Complete image generation for all 6 scenes before upload. Script changes to body[2] will require scene 4 image re-generation."

