feedback: |
  [강점]
  - 3막 구조(기대→충돌→반전) 완결성 높음. 팩트 나열형 아닌 순수 스토리텔링.
  - 심리적 반발(reactance): "빨간불이 뜨면 오히려 더 먹고 싶어진다" — 보편적 인간 심리를 코미디로 표현한 크리에이터 관점이 탁월.
  - "눈 감고 먹기로 했다" 펀치라인: 자기기만이라는 보편적 경험을 예측 불가 방식으로 표현 — 공유욕 유발 포인트.
  - 씬별 이미지 프롬프트 구체적이고 일관됨 (AR HUD 컬러코딩 초록/빨강 시각 언어 유지).
  - 이미지 안전: 모든 씬 프롬프트에 혐오·폭력·성적 콘텐츠 없음.

  [개선 필요]
  - 테마 중복 위험: EP038(냉장고 다이어트 감시, 2026-02-21 직전 에피소드)과 식이제한/다이어트 코미디 장르가 연속. 연속 유사 테마는 채널 다양성 저하 및 알고리즘 카나이발라이제이션 위험.
  - 총점 58점 (기준 70+ PASS 미충족) — 콘텐츠 자체는 기준 이상이나 채널 포트폴리오 관점에서 EP038과 간격 확보 필요.
  - 치킨 2마리 칼로리 2800kcal: 실제 통닭 2마리 기준 3000~4500kcal 범위. 코미디 맥락 허용이나, 더 큰 수치(예: 4200kcal)를 사용하면 충격 효과 강화 가능.
  - CTA 비어있음: 빈 문자열. 시리즈 연속 시청 유도 CTA("다음 편도 궁금하다면 구독!") 추가 검토 권장.

  [판정 근거]
  - 총점 58점 → REVISE 기준(50-69) 해당. 7개 항목 전부 최소 기준 충족.
  - REVISE 이유: 총점 70 미만 + EP038과 테마 근접성. 내용 자체 품질은 PASS 수준이므로 배치 스케줄 조정(EP038과 2~3편 간격) 후 재심사 시 PASS 가능.

