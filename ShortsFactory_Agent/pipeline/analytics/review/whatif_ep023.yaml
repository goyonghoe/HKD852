factual_accuracy_detail:
  - claim: "GPT-5.3-Codex는 시니어 개발자보다 빠르다"
    verdict: "MISLEADING"
    evidence: |
      GPT-5.3-Codex (released Feb 5, 2026) claims 25% faster inference than GPT-5.2-Codex
      and top scores on SWE-Bench Pro. OpenAI's announcement does NOT claim it outperforms
      senior developers. Community feedback is mixed — model sometimes stops mid-task or
      suggests workarounds. The script presents an editorialized exaggeration as fact.
    source: "https://community.openai.com/t/introducing-gpt-5-3-codex-the-most-powerful-interactive-and-productive-codex-yet/1373453"

  - claim: "Seedance 2.0은 감독 없이 영화를 만든다"
    verdict: "FALSE"
    evidence: |
      Seedance 2.0 (ByteDance, ~Feb 12-15 2026) is an advanced AI video generator requiring
      human direction — users must supply prompts, visual references, set parameters, and
      approve content. It generates 4-15 second clips, not films. It is semi-autonomous
      content generation, NOT autonomous filmmaking. The claim is factually incorrect.
    source: "https://techcrunch.com/2026/02/15/hollywood-isnt-happy-about-the-new-seedance-2-0-video-generator/"

