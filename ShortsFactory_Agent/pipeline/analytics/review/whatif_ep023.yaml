feedback: |
  EP023 tackles a timely high-RPM topic but has critical execution problems:

  1. FACTUAL ACCURACY (BLOCKING): Two specific product claims are exaggerated or false.
     "GPT-5.3-Codex는 시니어 개발자보다 빠르다" overstates benchmarks as human comparison.
     "Seedance 2.0은 감독 없이 영화를 만든다" is factually incorrect. YouTube 2026 policy
     explicitly penalizes misinformation. These MUST be corrected before upload.

  2. CREATOR PERSPECTIVE: The closing insight "AI에 나를 더했다" is the most overused AI
     career advice cliche of 2026. Every LinkedIn post says this. A Shorts channel needs
     a sharper, more specific, more surprising take. What does "adding yourself" actually
     look like? Give one concrete example.

  3. UNIQUENESS CONCERN: With EP018 (AI reads memories) already in the catalog, another
     AI-as-threat episode needs stronger structural differentiation. Both follow
     AI capability → dystopia → philosophical/practical conclusion.

  4. TECHNICAL: 2/6 images + 89% subtitle sync is NOT upload-ready.

