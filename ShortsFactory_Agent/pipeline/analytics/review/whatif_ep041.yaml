scores:
  source_citation: 7
  # 근거: 순수 창작 풍자물로 인용 가능한 외부 팩트/데이터가 없음.
  # 허구 시나리오이므로 학술 출처는 불필요하나, 메타데이터 description에
  # "창작 풍자 콘텐츠" 또는 "한국 직장인 번아웃 문화 기반 가상 시나리오" 명시가
  # 전무함. 정책 최저 기준(7)은 가까스로 충족.

  substantial_transformation: 9
  # 근거: "사람 몸에 배터리 표시"라는 인터넷 밈 소재를 단순 재조합하지 않음.
  # ① 직원이 무기로 사용 → ② 상사가 역전(감시 도구화) → ③ 만성 20%가 롤모델이 되는
  # 3막 아이러니 구조는 오리지널 창작 서사. 재편집·복제·단순 요약 없음.

  ai_misrepresentation_free: 10
  # 근거: 실명 인물, 실존 기업, 실제 사건 참조 없음. 모든 캐릭터는
  # "직장인/상사/신입" 추상 아키타입. 딥페이크·합성음성 오인 소지 없음.

  creator_perspective: 9
  # 근거: "배터리 가시화 → 노동자 해방"이라는 기대를 상사가 즉각 역이용하는
  # 역설적 시선이 명확함. "만성 20% = 번아웃의 전설"이라는 마무리는
  # 한국 직장 문화의 '어둠의 롤모델' 현상을 날카롭게 포착한 고유 관점.
  # 단순 팩트 나열이 아닌 기대→좌절→뒤틀린 깨달음 구조.

  uniqueness: 8
  # 근거: 기존 에피소드 비교 — EP030~038(냉장고 IoT, 광합성, 불로장생 등)과
  # 구조적 차별화 확인. 배터리 메타포를 '직장 감시 시스템'으로 연결하는
  # 각도는 시리즈 내 미사용. 다만 "기술이 권력자에게 역이용된다" 패턴은
  # IoT 냉장고 에피소드(EP038)와 주제적 유사성 존재 — 약한 감점 요인.

  hook_strength: 9
  # 근거: "만약에 사람 몸에 스마트폰처럼 배터리 잔량이 표시된다면?"은
  # ① 즉각적 자기 투영("나는 지금 몇 %지?") ② 스마트폰이라는 전 세계 공통 경험
  # ③ 번아웃 직장인 공감대 = 3중 어필. quality_check hook_pattern 효과값 82 확인.
  # 1초 이내 시청자를 잡는 what-if 공식 정석 적용.

  factual_accuracy: 8
  # 근거: 허구 시나리오 전체이므로 사실 오류 발생 구조 자체가 없음.
  # 내재된 사회적 전제(한국 직장 초과근무 문화, 번아웃 만연)는 실증 연구·
  # 언론 보도로 광범위하게 뒷받침되는 사회 현상. 잘못된 정보 전달 위험 없음.

total_score: 60
