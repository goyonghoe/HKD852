# ──────────────────────────────────────────────
# DETAILED FEEDBACK
# ──────────────────────────────────────────────
feedback: |
  [강점]
  - 3막 아이러니 구조 완성도 높음: "해방 도구 → 감시 도구 → 번아웃 훈장"의 비틀기가
    자연스럽게 연결되며 각 씬에서 기대치가 정확히 전복됨.
  - "만성 20% 직원이 롤모델"이라는 마무리 펀치라인은 한국 직장인의 집단 경험을
    정확히 포착. "어둠의 근성"에 대한 공감/씁쓸함을 동시에 자극 — 댓글 유도력 높음.
  - 스마트폰 배터리라는 범용 레퍼런스가 연령·직군 불문 즉각 이해 가능.
  - 씬 3의 이미지 프롬프트("저조자 우선 배치" 컬럼 강조)가 스크립트 갈등과 직결 — 시각-텍스트 싱크 우수.
  - quality_check SUCCESs 총점 50/60, hook effectiveness 82 — 내부 기준 상회.

  [개선 필요 — REVISE 사유]
  1. 총점 60 (50-69 구간) → REVISE 판정.
     아래 2개 항목을 개선하면 총점 70+ PASS 가능:

     A) source_citation (현재 7, 목표 8+):
        metadata.description에 "※ 본 영상은 한국 직장 번아웃 문화를 소재로 한
        순수 창작 풍자 콘텐츠입니다." 1줄 추가 권장.
        근거: YouTube 2026 AI 콘텐츠 정책은 시청자가 사실과 허구를 구분할 수 있도록
        명시적 맥락 제공을 권장. 현재 description에는 이런 명시가 없음.

     B) uniqueness (현재 8, 목표 9 도달 가능):
        EP038(냉장고 IoT)과 "기술이 사용자를 역이용" 패턴이 중복.
        씬 2 또는 씬 3에 EP038에 없는 각도 — 예: "저배터리 직원에게 충전 스테이션 지급"
        또는 "배터리 보조금 노사협상" 등 제도적 역설 요소 1가지 추가 검토 권장.
        (선택적 개선, 즉시 재제출 불필요)

  2. metadata.cta 필드 공백:
     CTA 없이 알고리즘 노출 후 시청자 행동을 유도하는 요소가 전무.
     최소 "여러분은 몇 %? 댓글로 알려주세요 👇" 또는 "구독하면 충전 +10% 🔋"
     형식의 단문 CTA 추가 강력 권장 (engagement rate 직결).

  [추가 참고]
  - TTS 주의: "18%" → "십팔 퍼센트" 한국어 숫자 전처리 확인 요망.
    현재 파이프라인 v3.2에서 `20대` → `이십대` 처리 확인됐으나,
    퍼센트 수치 읽기 교정이 render 단계에서 검증되어야 함.
  - 씬 3 대사 "저조자 우선 배치"의 TTS 호흡: 대조적 열거 구조이므로
    "야근 면제" / "저조자 우선 배치" 사이에 강조 포즈가 자연스럽게 들어가는지 확인.

