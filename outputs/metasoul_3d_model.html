<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>META SOUL #74 - Real 3D Model</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d0d1a;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .title {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }
      .title h1 {
        font-size: 22px;
        letter-spacing: 6px;
        color: #ffaa44;
        text-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
      }
      .title p {
        font-size: 10px;
        letter-spacing: 3px;
        color: #667;
        margin-top: 4px;
      }
      .badge {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        pointer-events: none;
        text-align: right;
      }
      .badge div {
        font-size: 9px;
        letter-spacing: 2px;
        color: #445;
        line-height: 1.8;
      }
      .badge .v {
        color: #ffaa44;
      }
      .info {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        pointer-events: none;
        font-size: 11px;
        color: #556;
        letter-spacing: 2px;
      }
      .controls {
        position: fixed;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
      }
      .controls button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 170, 68, 0.25);
        color: #888;
        padding: 8px 18px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 2px;
        transition: all 0.3s;
      }
      .controls button:hover,
      .controls button.active {
        background: rgba(255, 170, 68, 0.12);
        border-color: #ffaa44;
        color: #ffaa44;
        box-shadow: 0 0 15px rgba(255, 170, 68, 0.15);
      }
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        text-align: center;
      }
      .loading h2 {
        font-size: 16px;
        letter-spacing: 4px;
        color: #ffaa44;
      }
      .loading p {
        font-size: 11px;
        color: #556;
        margin-top: 8px;
      }
      .loading .bar {
        width: 200px;
        height: 3px;
        background: #222;
        border-radius: 2px;
        margin: 12px auto 0;
        overflow: hidden;
      }
      .loading .bar .fill {
        height: 100%;
        background: linear-gradient(90deg, #ff6a00, #ffaa44);
        width: 0%;
        transition: width 0.3s;
      }
      .vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.5) 100%
        );
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <div class="title">
      <h1>META SOUL #74</h1>
      <p>3D MODEL &mdash; GENERATED BY TRIPOSR (LOCAL)</p>
    </div>
    <div class="badge">
      <div>SOUL <span class="v">#074</span></div>
      <div>CLASS <span class="v">GUARDIAN</span></div>
      <div>MESH <span class="v" id="meshInfo">Loading...</span></div>
      <div>ENGINE <span class="v">TripoSR CPU</span></div>
    </div>
    <div class="controls">
      <button class="active" onclick="setEnv('cyber')">CYBER</button>
      <button onclick="setEnv('studio')">STUDIO</button>
      <button onclick="setEnv('void')">VOID</button>
      <button onclick="toggleAutoRotate()">AUTO ROTATE</button>
      <button onclick="toggleWire()">WIREFRAME</button>
    </div>
    <div class="info">
      DRAG TO ORBIT &middot; SCROLL TO ZOOM &middot; RIGHT-CLICK TO PAN
    </div>
    <div class="loading" id="loader">
      <h2>LOADING 3D MODEL</h2>
      <p>TripoSR Generated Mesh</p>
      <div class="bar"><div class="fill" id="loadBar"></div></div>
    </div>
    <canvas id="c"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.6;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a18);

      const camera = new THREE.PerspectiveCamera(
        45,
        innerWidth / innerHeight,
        0.01,
        100,
      );
      camera.position.set(0, 0.5, 2.5);

      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 0.4, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;
      controls.minDistance = 0.5;
      controls.maxDistance = 8;
      controls.update();

      // === LIGHTS ===
      const ambient = new THREE.AmbientLight(0x445566, 2);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffeedd, 3);
      keyLight.position.set(3, 5, 4);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x4488ff, 1.5);
      fillLight.position.set(-3, 2, -2);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xff6a00, 2);
      rimLight.position.set(0, 3, -4);
      scene.add(rimLight);

      const spotDown = new THREE.SpotLight(0xffffff, 2, 10, Math.PI / 5, 0.5);
      spotDown.position.set(0, 5, 0);
      spotDown.target.position.set(0, 0, 0);
      spotDown.castShadow = true;
      scene.add(spotDown);
      scene.add(spotDown.target);

      // === FLOOR ===
      const floorGeo = new THREE.CircleGeometry(5, 64);
      const floorMat = new THREE.MeshPhysicalMaterial({
        color: 0x111122,
        roughness: 0.1,
        metalness: 0.9,
        clearcoat: 1,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.01;
      floor.receiveShadow = true;
      scene.add(floor);

      // Floor ring
      const ringGeo = new THREE.TorusGeometry(1.2, 0.008, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00eeff,
        transparent: true,
        opacity: 0.3,
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.01;
      scene.add(ring);

      // Grid
      const gridMat2 = new THREE.LineBasicMaterial({
        color: 0x223355,
        transparent: true,
        opacity: 0.15,
      });
      for (let i = -5; i <= 5; i++) {
        scene.add(
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(i, 0, -5),
              new THREE.Vector3(i, 0, 5),
            ]),
            gridMat2,
          ),
        );
        scene.add(
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(-5, 0, i),
              new THREE.Vector3(5, 0, i),
            ]),
            gridMat2,
          ),
        );
      }

      // === PARTICLES ===
      const partCount = 500;
      const partGeo = new THREE.BufferGeometry();
      const partPos = new Float32Array(partCount * 3);
      for (let i = 0; i < partCount; i++) {
        partPos[i * 3] = (Math.random() - 0.5) * 6;
        partPos[i * 3 + 1] = Math.random() * 4;
        partPos[i * 3 + 2] = (Math.random() - 0.5) * 6;
      }
      partGeo.setAttribute("position", new THREE.BufferAttribute(partPos, 3));
      const partMat = new THREE.PointsMaterial({
        color: 0xff8844,
        size: 0.015,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const particles = new THREE.Points(partGeo, partMat);
      scene.add(particles);

      // === LOAD 3D MODEL ===
      let model = null;
      let wireOverlay = null;
      const gltfLoader = new GLTFLoader();
      const loadBar = document.getElementById("loadBar");

      gltfLoader.load(
        "./metasoul_74.glb",
        (gltf) => {
          model = gltf.scene;

          // Center and scale
          const box = new THREE.Box3().setFromObject(model);
          const center = new THREE.Vector3();
          box.getCenter(center);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 1.5 / maxDim;
          model.scale.setScalar(scale);
          model.position.sub(center.multiplyScalar(scale));
          model.position.y += size.y * scale * 0.5;

          // Enhance materials
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material) {
                child.material.roughness = Math.max(
                  0.2,
                  child.material.roughness || 0.5,
                );
                child.material.metalness = Math.min(
                  0.3,
                  child.material.metalness || 0.1,
                );
                child.material.envMapIntensity = 1.5;
              }
            }
          });

          scene.add(model);

          // Update controls target
          const newBox = new THREE.Box3().setFromObject(model);
          const newCenter = new THREE.Vector3();
          newBox.getCenter(newCenter);
          controls.target.copy(newCenter);

          // Mesh info
          let totalVerts = 0,
            totalFaces = 0;
          model.traverse((c) => {
            if (c.isMesh && c.geometry) {
              totalVerts += c.geometry.attributes.position?.count || 0;
              totalFaces += (c.geometry.index?.count || 0) / 3;
            }
          });
          document.getElementById("meshInfo").textContent =
            `${(totalVerts / 1000).toFixed(1)}K verts`;

          // Create wireframe overlay
          model.traverse((c) => {
            if (c.isMesh) {
              const wGeo = new THREE.WireframeGeometry(c.geometry);
              const wMat = new THREE.LineBasicMaterial({
                color: 0x00eeff,
                transparent: true,
                opacity: 0,
              });
              wireOverlay = new THREE.LineSegments(wGeo, wMat);
              wireOverlay.scale.copy(model.scale);
              wireOverlay.position.copy(model.position);
              scene.add(wireOverlay);
            }
          });

          // Hide loader
          document.getElementById("loader").style.display = "none";
        },
        (progress) => {
          if (progress.total > 0) {
            const pct = (progress.loaded / progress.total) * 100;
            loadBar.style.width = pct + "%";
          }
        },
        (error) => {
          console.error("GLB load error:", error);
          document.getElementById("loader").innerHTML =
            '<h2 style="color:#ff4444">LOAD ERROR</h2><p>Could not load GLB model</p>';
        },
      );

      // === ENVIRONMENT PRESETS ===
      let currentEnv = "cyber";
      window.setEnv = (env) => {
        currentEnv = env;
        document
          .querySelectorAll(".controls button")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");

        switch (env) {
          case "cyber":
            scene.background = new THREE.Color(0x0a0a18);
            ambient.color.set(0x445566);
            ambient.intensity = 2;
            rimLight.color.set(0xff6a00);
            rimLight.intensity = 2;
            floorMat.color.set(0x111122);
            particles.visible = true;
            break;
          case "studio":
            scene.background = new THREE.Color(0x1a1a22);
            ambient.color.set(0x888899);
            ambient.intensity = 3;
            rimLight.color.set(0xffffff);
            rimLight.intensity = 1;
            floorMat.color.set(0x222233);
            particles.visible = false;
            break;
          case "void":
            scene.background = new THREE.Color(0x000005);
            ambient.color.set(0x222244);
            ambient.intensity = 1;
            rimLight.color.set(0xff00aa);
            rimLight.intensity = 3;
            floorMat.color.set(0x050510);
            particles.visible = true;
            break;
        }
      };

      window.toggleAutoRotate = () => {
        controls.autoRotate = !controls.autoRotate;
        event.target.classList.toggle("active");
      };

      window.toggleWire = () => {
        if (wireOverlay) {
          const show = wireOverlay.material.opacity < 0.01;
          wireOverlay.material.opacity = show ? 0.15 : 0;
          event.target.classList.toggle("active");
        }
      };

      // === ANIMATE ===
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        controls.update();

        // Ring pulse
        ring.rotation.z = t * 0.1;
        ringMat.opacity = 0.25 + Math.sin(t * 2) * 0.1;

        // Particles
        if (particles.visible) {
          const pp = particles.geometry.attributes.position.array;
          for (let i = 0; i < partCount; i++) {
            pp[i * 3 + 1] += 0.002 + Math.sin(t + i) * 0.001;
            if (pp[i * 3 + 1] > 4) pp[i * 3 + 1] = 0;
          }
          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Light animation
        rimLight.position.x = Math.cos(t * 0.5) * 4;
        rimLight.position.z = Math.sin(t * 0.5) * 4;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
