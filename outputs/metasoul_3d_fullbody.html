<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>META SOUL #74 - 3D Concept Art</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d0d1a;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 10;
      }
      .title {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }
      .title h1 {
        font-size: 20px;
        letter-spacing: 6px;
        color: #ffaa44;
        text-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
      }
      .title p {
        font-size: 10px;
        letter-spacing: 4px;
        color: #668;
        margin-top: 4px;
      }
      .info {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
        font-size: 11px;
        color: #556;
        letter-spacing: 2px;
      }
      .badge {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
        pointer-events: none;
        text-align: right;
      }
      .badge div {
        font-size: 9px;
        letter-spacing: 2px;
        color: #445;
        line-height: 1.8;
      }
      .badge .v {
        color: #ffaa44;
      }
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.6) 100%
        );
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <div class="title">
      <h1>META SOUL #74</h1>
      <p>CONCEPT ART &mdash; FULL BODY RENDER</p>
    </div>
    <div class="badge">
      <div>SOUL <span class="v">#074</span></div>
      <div>CLASS <span class="v">GUARDIAN</span></div>
      <div>TRAIT <span class="v">SMILEY MASK</span></div>
      <div>RARITY <span class="v">LEGENDARY</span></div>
    </div>
    <div class="info">DRAG TO ORBIT &middot; SCROLL TO ZOOM</div>
    <canvas id="c"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // --- Renderer ---
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.8;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a18);
      scene.fog = new THREE.FogExp2(0x0a0a18, 0.015);

      const camera = new THREE.PerspectiveCamera(
        50,
        innerWidth / innerHeight,
        0.1,
        200,
      );
      camera.position.set(0, 2, 6);

      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 1.5, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 3;
      controls.maxDistance = 15;
      controls.maxPolarAngle = Math.PI * 0.85;
      controls.update();

      // === LIGHTS ===
      const ambient = new THREE.AmbientLight(0x334466, 1.5);
      scene.add(ambient);

      const mainLight = new THREE.DirectionalLight(0xffeedd, 2);
      mainLight.position.set(5, 8, 5);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.set(2048, 2048);
      mainLight.shadow.camera.near = 0.5;
      mainLight.shadow.camera.far = 30;
      mainLight.shadow.camera.left = -8;
      mainLight.shadow.camera.right = 8;
      mainLight.shadow.camera.top = 8;
      mainLight.shadow.camera.bottom = -8;
      scene.add(mainLight);

      // Neon accent lights
      const neonOrange = new THREE.PointLight(0xff6a00, 3, 12);
      neonOrange.position.set(-3, 3, 2);
      scene.add(neonOrange);

      const neonCyan = new THREE.PointLight(0x00eeff, 3, 12);
      neonCyan.position.set(3, 2, -1);
      scene.add(neonCyan);

      const neonPink = new THREE.PointLight(0xff44aa, 2, 10);
      neonPink.position.set(0, 5, -3);
      scene.add(neonPink);

      const spotLight = new THREE.SpotLight(0xffffff, 3, 20, Math.PI / 6, 0.5);
      spotLight.position.set(0, 8, 4);
      spotLight.target.position.set(0, 1.5, 0);
      spotLight.castShadow = true;
      scene.add(spotLight);
      scene.add(spotLight.target);

      // === GROUND - Reflective cyberpunk floor ===
      const floorGeo = new THREE.PlaneGeometry(60, 60);
      const floorMat = new THREE.MeshPhysicalMaterial({
        color: 0x111122,
        roughness: 0.15,
        metalness: 0.8,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Floor grid lines
      const gridMat = new THREE.LineBasicMaterial({
        color: 0x223355,
        transparent: true,
        opacity: 0.3,
      });
      for (let i = -15; i <= 15; i++) {
        const pts = [
          new THREE.Vector3(i, 0.01, -15),
          new THREE.Vector3(i, 0.01, 15),
        ];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(geo, gridMat));
        const pts2 = [
          new THREE.Vector3(-15, 0.01, i),
          new THREE.Vector3(15, 0.01, i),
        ];
        scene.add(
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts2),
            gridMat,
          ),
        );
      }

      // === CHARACTER ===
      const charGroup = new THREE.Group();
      scene.add(charGroup);

      const loader = new THREE.TextureLoader();

      // Upper body - original image
      const charTex = loader.load(
        "https://metasoulclub.com/assets/samples/74.png",
      );
      charTex.colorSpace = THREE.SRGBColorSpace;

      // Character billboard (upper body) with alpha cutout
      const upperGeo = new THREE.PlaneGeometry(2.2, 2.2);
      const upperMat = new THREE.MeshPhysicalMaterial({
        map: charTex,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.DoubleSide,
        roughness: 0.4,
        metalness: 0.05,
        emissive: new THREE.Color(0x221100),
        emissiveIntensity: 0.2,
      });
      const upperMesh = new THREE.Mesh(upperGeo, upperMat);
      upperMesh.position.y = 2.7;
      upperMesh.castShadow = true;
      charGroup.add(upperMesh);

      // === PROCEDURAL LOWER BODY (matching yellow/pink armor) ===
      const armorYellow = 0xccaa22;
      const armorPink = 0xbb3388;
      const armorDark = 0x443322;
      const armorTeal = 0x22aa99;

      // --- Waist / Belt ---
      const waistGeo = new THREE.CylinderGeometry(0.38, 0.35, 0.25, 8);
      const waistMat = new THREE.MeshPhysicalMaterial({
        color: armorDark,
        roughness: 0.3,
        metalness: 0.7,
      });
      const waist = new THREE.Mesh(waistGeo, waistMat);
      waist.position.y = 1.48;
      waist.castShadow = true;
      charGroup.add(waist);

      // Belt buckle
      const buckleGeo = new THREE.BoxGeometry(0.2, 0.12, 0.08);
      const buckleMat = new THREE.MeshPhysicalMaterial({
        color: armorTeal,
        roughness: 0.2,
        metalness: 0.9,
        emissive: new THREE.Color(0x00ffaa),
        emissiveIntensity: 0.3,
      });
      const buckle = new THREE.Mesh(buckleGeo, buckleMat);
      buckle.position.set(0, 1.48, 0.36);
      charGroup.add(buckle);

      // --- Hip armor plates ---
      const hipGeo = new THREE.CylinderGeometry(0.4, 0.32, 0.3, 6);
      const hipMatL = new THREE.MeshPhysicalMaterial({
        color: armorPink,
        roughness: 0.3,
        metalness: 0.5,
      });
      const hipL = new THREE.Mesh(hipGeo, hipMatL);
      hipL.position.set(-0.25, 1.3, 0);
      hipL.castShadow = true;
      charGroup.add(hipL);

      const hipR = new THREE.Mesh(
        hipGeo,
        new THREE.MeshPhysicalMaterial({
          color: armorYellow,
          roughness: 0.3,
          metalness: 0.5,
        }),
      );
      hipR.position.set(0.25, 1.3, 0);
      hipR.castShadow = true;
      charGroup.add(hipR);

      // --- Thighs ---
      function createLeg(xOffset, isLeft) {
        const legGroup = new THREE.Group();

        // Thigh
        const thighGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.55, 8);
        const thighMat = new THREE.MeshPhysicalMaterial({
          color: isLeft ? armorPink : armorYellow,
          roughness: 0.35,
          metalness: 0.5,
        });
        const thigh = new THREE.Mesh(thighGeo, thighMat);
        thigh.position.y = 0.85;
        thigh.castShadow = true;
        legGroup.add(thigh);

        // Knee joint
        const kneeGeo = new THREE.SphereGeometry(0.13, 8, 8);
        const kneeMat = new THREE.MeshPhysicalMaterial({
          color: armorDark,
          roughness: 0.2,
          metalness: 0.8,
        });
        const knee = new THREE.Mesh(kneeGeo, kneeMat);
        knee.position.y = 0.57;
        knee.castShadow = true;
        legGroup.add(knee);

        // Knee light
        const kneeLightGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const kneeLightMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        const kneeLight = new THREE.Mesh(kneeLightGeo, kneeLightMat);
        kneeLight.position.set(0, 0.57, 0.12);
        legGroup.add(kneeLight);

        // Shin
        const shinGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.5, 8);
        const shinMat = new THREE.MeshPhysicalMaterial({
          color: isLeft ? armorYellow : armorPink,
          roughness: 0.35,
          metalness: 0.5,
        });
        const shin = new THREE.Mesh(shinGeo, shinMat);
        shin.position.y = 0.3;
        shin.castShadow = true;
        legGroup.add(shin);

        // Shin guard plate
        const guardGeo = new THREE.BoxGeometry(0.08, 0.25, 0.16);
        const guardMat = new THREE.MeshPhysicalMaterial({
          color: armorDark,
          roughness: 0.2,
          metalness: 0.8,
        });
        const guard = new THREE.Mesh(guardGeo, guardMat);
        guard.position.set(0, 0.32, 0.1);
        legGroup.add(guard);

        // Boot
        const bootGeo = new THREE.CylinderGeometry(0.1, 0.14, 0.15, 8);
        const bootMat = new THREE.MeshPhysicalMaterial({
          color: armorDark,
          roughness: 0.25,
          metalness: 0.7,
        });
        const boot = new THREE.Mesh(bootGeo, bootMat);
        boot.position.y = 0.07;
        boot.castShadow = true;
        legGroup.add(boot);

        // Boot toe
        const toeGeo = new THREE.BoxGeometry(0.14, 0.08, 0.22);
        const toeMat = new THREE.MeshPhysicalMaterial({
          color: isLeft ? armorPink : armorYellow,
          roughness: 0.3,
          metalness: 0.5,
        });
        const toe = new THREE.Mesh(toeGeo, toeMat);
        toe.position.set(0, 0.01, 0.06);
        toe.castShadow = true;
        legGroup.add(toe);

        // Boot glow strip
        const stripGeo = new THREE.BoxGeometry(0.16, 0.02, 0.02);
        const stripMat = new THREE.MeshBasicMaterial({ color: 0x00eeff });
        const strip = new THREE.Mesh(stripGeo, stripMat);
        strip.position.set(0, 0.04, 0.16);
        legGroup.add(strip);

        legGroup.position.x = xOffset;
        return legGroup;
      }

      const leftLeg = createLeg(-0.22, true);
      charGroup.add(leftLeg);
      const rightLeg = createLeg(0.22, false);
      charGroup.add(rightLeg);

      // === CYBERPUNK BUILDINGS ===
      function createBuilding(x, z, w, h, d, color) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshPhysicalMaterial({
          color,
          roughness: 0.6,
          metalness: 0.3,
          emissive: new THREE.Color(color).multiplyScalar(0.05),
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, h / 2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      // Background buildings
      const buildings = [
        createBuilding(-8, -6, 3, 12, 3, 0x1a1a2e),
        createBuilding(-4.5, -8, 2.5, 18, 2.5, 0x151528),
        createBuilding(-2, -10, 2, 8, 4, 0x1e1e35),
        createBuilding(2.5, -9, 3, 15, 2, 0x161630),
        createBuilding(5.5, -7, 2, 10, 3, 0x1a1a30),
        createBuilding(8, -8, 3.5, 20, 3, 0x121225),
        createBuilding(-6, -12, 2, 22, 2, 0x0f0f22),
        createBuilding(0, -14, 4, 25, 2, 0x111128),
        createBuilding(6, -13, 2.5, 16, 2.5, 0x141430),
        // Side buildings
        createBuilding(-7, 0, 2, 8, 3, 0x181830),
        createBuilding(7, -1, 2.5, 10, 2, 0x161628),
        createBuilding(-6, 4, 3, 6, 2, 0x1a1a2a),
        createBuilding(6.5, 3, 2, 7, 3, 0x151525),
      ];
      buildings.forEach((b) => scene.add(b));

      // Neon window lights on buildings
      function addWindowLights(building, count, color) {
        const box = new THREE.Box3().setFromObject(building);
        const size = new THREE.Vector3();
        box.getSize(size);
        const center = new THREE.Vector3();
        box.getCenter(center);

        for (let i = 0; i < count; i++) {
          const wGeo = new THREE.PlaneGeometry(0.15, 0.1);
          const wMat = new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.6 + Math.random() * 0.4,
          });
          const w = new THREE.Mesh(wGeo, wMat);
          w.position.set(
            center.x + (Math.random() - 0.5) * size.x * 0.8,
            box.min.y + Math.random() * size.y * 0.9 + 0.5,
            box.max.z + 0.01,
          );
          scene.add(w);
        }
      }
      const windowColors = [0xff6a00, 0x00eeff, 0xff44aa, 0xaaff00, 0xffdd00];
      buildings.forEach((b) => {
        addWindowLights(
          b,
          5 + Math.floor(Math.random() * 10),
          windowColors[Math.floor(Math.random() * windowColors.length)],
        );
      });

      // === NEON SIGNS (vertical bars) ===
      function createNeonBar(x, y, z, height, color, rotY) {
        const geo = new THREE.BoxGeometry(0.06, height, 0.06);
        const mat = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.8,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        mesh.rotation.y = rotY || 0;
        scene.add(mesh);

        const light = new THREE.PointLight(color, 1, 4);
        light.position.set(x, y, z);
        scene.add(light);
      }

      createNeonBar(-4, 3, -4, 4, 0xff4400, 0);
      createNeonBar(4.5, 4, -5, 5, 0x00ddff, 0);
      createNeonBar(-3, 2.5, -3, 2, 0xff00aa, 0.3);
      createNeonBar(3, 1.5, -2, 1.5, 0x44ff88, -0.2);

      // === HOLOGRAPHIC RING around character ===
      const holoRingGeo = new THREE.TorusGeometry(1.2, 0.01, 16, 80);
      const holoRingMat = new THREE.MeshBasicMaterial({
        color: 0x00eeff,
        transparent: true,
        opacity: 0.25,
      });
      const holoRing = new THREE.Mesh(holoRingGeo, holoRingMat);
      holoRing.position.y = 0.05;
      holoRing.rotation.x = Math.PI / 2;
      charGroup.add(holoRing);

      const holoRing2 = new THREE.Mesh(
        new THREE.TorusGeometry(1.0, 0.008, 16, 60),
        new THREE.MeshBasicMaterial({
          color: 0xff6a00,
          transparent: true,
          opacity: 0.15,
        }),
      );
      holoRing2.position.y = 0.03;
      holoRing2.rotation.x = Math.PI / 2;
      charGroup.add(holoRing2);

      // === PLATFORM / PEDESTAL ===
      const platGeo = new THREE.CylinderGeometry(0.8, 1.0, 0.1, 32);
      const platMat = new THREE.MeshPhysicalMaterial({
        color: 0x222244,
        roughness: 0.1,
        metalness: 0.9,
        emissive: new THREE.Color(0x112244),
        emissiveIntensity: 0.3,
        clearcoat: 1.0,
      });
      const platform = new THREE.Mesh(platGeo, platMat);
      platform.position.y = -0.05;
      platform.receiveShadow = true;
      charGroup.add(platform);

      // Platform edge glow
      const platEdgeGeo = new THREE.TorusGeometry(0.9, 0.015, 8, 64);
      const platEdgeMat = new THREE.MeshBasicMaterial({
        color: 0x00eeff,
        transparent: true,
        opacity: 0.5,
      });
      const platEdge = new THREE.Mesh(platEdgeGeo, platEdgeMat);
      platEdge.rotation.x = Math.PI / 2;
      platEdge.position.y = 0.01;
      charGroup.add(platEdge);

      // === RAIN PARTICLES ===
      const rainCount = 3000;
      const rainGeo = new THREE.BufferGeometry();
      const rainPos = new Float32Array(rainCount * 3);
      const rainVel = new Float32Array(rainCount);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 30;
        rainPos[i * 3 + 1] = Math.random() * 20;
        rainPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
        rainVel[i] = 0.05 + Math.random() * 0.1;
      }
      rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
      const rainMat = new THREE.PointsMaterial({
        color: 0x6688cc,
        size: 0.03,
        transparent: true,
        opacity: 0.3,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const rain = new THREE.Points(rainGeo, rainMat);
      scene.add(rain);

      // === FLOATING PARTICLES (embers) ===
      const emberCount = 200;
      const emberGeo = new THREE.BufferGeometry();
      const emberPos = new Float32Array(emberCount * 3);
      for (let i = 0; i < emberCount; i++) {
        emberPos[i * 3] = (Math.random() - 0.5) * 8;
        emberPos[i * 3 + 1] = Math.random() * 6;
        emberPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
      }
      emberGeo.setAttribute("position", new THREE.BufferAttribute(emberPos, 3));
      const emberMat = new THREE.PointsMaterial({
        color: 0xff8844,
        size: 0.04,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const embers = new THREE.Points(emberGeo, emberMat);
      scene.add(embers);

      // === ANIMATION ===
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        controls.update();

        // Character subtle float
        charGroup.position.y = Math.sin(t * 0.8) * 0.03;

        // Upper body always faces camera (billboard)
        upperMesh.quaternion.copy(camera.quaternion);

        // Holo rings rotate
        holoRing.rotation.z = t * 0.3;
        holoRing2.rotation.z = -t * 0.2;
        holoRingMat.opacity = 0.2 + Math.sin(t * 2) * 0.08;

        // Platform edge pulse
        platEdgeMat.opacity = 0.4 + Math.sin(t * 3) * 0.15;

        // Knee lights pulse
        leftLeg.children[2].material.color.setHSL(
          0.45 + Math.sin(t * 3) * 0.05,
          1,
          0.5,
        );
        rightLeg.children[2].material.color.setHSL(
          0.45 + Math.sin(t * 3 + 1) * 0.05,
          1,
          0.5,
        );

        // Rain
        const rp = rain.geometry.attributes.position.array;
        for (let i = 0; i < rainCount; i++) {
          rp[i * 3 + 1] -= rainVel[i];
          if (rp[i * 3 + 1] < 0) {
            rp[i * 3 + 1] = 18 + Math.random() * 4;
            rp[i * 3] = (Math.random() - 0.5) * 30;
            rp[i * 3 + 2] = (Math.random() - 0.5) * 30;
          }
        }
        rain.geometry.attributes.position.needsUpdate = true;

        // Embers float up
        const ep = embers.geometry.attributes.position.array;
        for (let i = 0; i < emberCount; i++) {
          ep[i * 3 + 1] += 0.003 + Math.sin(t + i) * 0.002;
          ep[i * 3] += Math.sin(t * 0.5 + i * 0.1) * 0.002;
          if (ep[i * 3 + 1] > 7) {
            ep[i * 3 + 1] = 0;
            ep[i * 3] = (Math.random() - 0.5) * 8;
            ep[i * 3 + 2] = (Math.random() - 0.5) * 8;
          }
        }
        embers.geometry.attributes.position.needsUpdate = true;

        // Neon lights flicker
        neonOrange.intensity = 3 + Math.sin(t * 4) * 0.5;
        neonCyan.intensity = 3 + Math.cos(t * 3) * 0.5;
        neonPink.intensity = 2 + Math.sin(t * 5) * 0.3;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
