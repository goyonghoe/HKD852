<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* === PLAYBOOK TEMPLATE ===
   용도: 실행 가이드, 수익화 전략, How-to, 단계별 안내
   특징: 타임라인 + 체크리스트 + 의사결정 트리 + 액션 스텝
*/
*{margin:0;padding:0;box-sizing:border-box}
body{background:{{BG_COLOR}};color:#e2e8f0;font-family:'Noto Sans KR',sans-serif;line-height:1.7}
a{color:{{PRIMARY}};text-decoration:none}

.nav{position:sticky;top:0;z-index:100;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,.1);padding:12px 0}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;gap:16px;overflow-x:auto;padding:0 24px;font-size:13px;font-weight:500}
.nav a{color:#94a3b8;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
.nav a:hover{color:{{PRIMARY}};border-color:{{PRIMARY}};text-decoration:none}

.wrap{max-width:1100px;margin:0 auto;padding:32px 24px 64px}

.header{text-align:center;padding:48px 0 40px;border-bottom:1px solid rgba(148,163,184,.08);margin-bottom:40px}
.header h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,{{GRADIENT}});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.header .meta{font-size:14px;color:#64748b}

/* HERO — 핵심 메시지 강조 (플레이북 전용) */
.hero{background:linear-gradient(135deg,{{PRIMARY_18}},{{SECONDARY_12}});border:1px solid {{PRIMARY_25}};border-radius:20px;padding:40px;margin-bottom:40px;text-align:center}
.hero h2{font-size:26px;font-weight:900;color:{{PRIMARY_LIGHT}};margin-bottom:12px}
.hero p{font-size:16px;color:{{PRIMARY_MID}};max-width:700px;margin:0 auto}

/* TIMELINE — 수직 타임라인 (플레이북 핵심 컴포넌트) */
.timeline{position:relative;padding-left:48px;margin:24px 0}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,{{PRIMARY}},{{SECONDARY}},{{TERTIARY}})}
.tl-item{position:relative;margin-bottom:28px}
.tl-dot{position:absolute;left:-38px;top:2px;width:18px;height:18px;border-radius:50%;border:3px solid;background:{{BG_COLOR}}}
.tl-time{font-size:14px;font-weight:700;margin-bottom:6px}
.tl-body{font-size:14px;color:#cbd5e1}
.tl-result{font-size:20px;font-weight:900;margin-top:6px}

/* CHECKLIST — 체크리스트 (액션 아이템) */
.checklist{list-style:none;padding:0;margin:16px 0}
.checklist li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.06);font-size:14px;color:#cbd5e1}
.checklist li::before{content:'';flex-shrink:0;width:20px;height:20px;border:2px solid {{PRIMARY_40}};border-radius:6px;margin-top:1px}
.checklist li.done::before{background:{{PRIMARY}};border-color:{{PRIMARY}};background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 20 20' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l2 2 4-4' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E")}

/* DECISION — 의사결정 분기 */
.decision{background:rgba(30,41,59,.6);border:2px dashed {{PRIMARY_30}};border-radius:16px;padding:24px;margin:20px 0;text-align:center}
.decision h4{font-size:16px;font-weight:700;color:{{PRIMARY_LIGHT}};margin-bottom:16px}
.decision .branches{display:flex;gap:16px;justify-content:center}
.decision .branch{flex:1;max-width:280px;padding:16px;background:rgba(15,23,42,.4);border-radius:12px;border:1px solid rgba(148,163,184,.1)}
.decision .branch h5{font-size:14px;font-weight:700;margin-bottom:8px}
.decision .branch p{font-size:13px;color:#94a3b8}

/* STEP CARD — 단계 카드 */
.step{background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.1);border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden;display:flex;gap:20px;align-items:flex-start}
.step::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:linear-gradient(180deg,{{PRIMARY}},{{SECONDARY}})}
.step-num{flex-shrink:0;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;background:{{PRIMARY_15}};color:{{PRIMARY}}}
.step-body h3{font-size:17px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
.step-body p{font-size:14px;color:#cbd5e1}

/* SECTION, CARD, GRID, QUOTE, TAG 등은 analysis와 동일 */
.section{margin-bottom:48px;scroll-margin-top:72px}
.section h2{font-size:24px;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid {{PRIMARY_20}};color:#f1f5f9}
.card{background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.1);border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,{{PRIMARY}},{{SECONDARY}})}
.card h3{font-size:17px;font-weight:700;margin-bottom:12px;color:#f1f5f9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.quote{border-left:3px solid {{PRIMARY}};padding:16px 20px;margin:16px 0;background:{{PRIMARY_06}};border-radius:0 8px 8px 0;font-size:15px;color:{{PRIMARY_LIGHT}}}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;margin:16px 0}
.tbl th{text-align:left;font-size:13px;color:#94a3b8;padding:10px 14px;border-bottom:1px solid rgba(148,163,184,.15);font-weight:500;background:rgba(15,23,42,.4)}
.tbl td{font-size:14px;padding:10px 14px;border-bottom:1px solid rgba(148,163,184,.08);color:#cbd5e1}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:8px;font-size:15px;color:#cbd5e1}li strong{color:#f1f5f9}
.footer{text-align:center;padding:32px 0;color:#475569;font-size:13px;border-top:1px solid rgba(148,163,184,.1);margin-top:48px}
@media print{body{background:#fff;color:#1e293b}.nav{display:none}.card,.step{border:1px solid #e2e8f0;background:#f8fafc}.card::before,.step::before{display:none}.header h1{-webkit-text-fill-color:#1e293b}}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.decision .branches{flex-direction:column;align-items:center}.header h1{font-size:26px}}
</style>
</head>
<body>
<!--
  PLAYBOOK TEMPLATE
  차별화 컴포넌트:
  - .hero — 핵심 메시지 강조 박스
  - .timeline + .tl-item — 수직 타임라인 (단계/일정)
  - .checklist — 체크리스트 (실행 항목)
  - .decision + .branch — 의사결정 분기 다이어그램
  - .step + .step-num — 번호 매긴 단계 카드

  구조:
  1. hero — "한 줄 핵심 메시지"
  2. timeline — 전체 여정 개요
  3. step × N — 상세 단계 설명
  4. decision — 분기점 (어떤 경우 A vs B)
  5. checklist — 각 단계 실행 항목
-->
<div class="nav"><div class="nav-inner">{{NAV_LINKS}}</div></div>
<div class="wrap">
<div class="header">
<h1>{{TITLE}}</h1>
<p style="font-size:18px;color:#94a3b8;margin-bottom:16px">{{SUBTITLE}}</p>
<div class="meta">{{META}}</div>
</div>
{{CONTENT}}
<div class="footer">{{FOOTER}}</div>
</div>
</body>
</html>
