<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* === DASHBOARD TEMPLATE ===
   용도: 현황 리포트, 성과 추적, KPI 모니터링, 산업 리포트
   특징: KPI 카드 + 진행률 바 + 상태 뱃지 + 미니 차트 + 실시간 느낌
*/
*{margin:0;padding:0;box-sizing:border-box}
body{background:{{BG_COLOR}};color:#e2e8f0;font-family:'Noto Sans KR',sans-serif;line-height:1.7}
a{color:{{PRIMARY}};text-decoration:none}

.nav{position:sticky;top:0;z-index:100;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,.1);padding:12px 0}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:16px;overflow-x:auto;padding:0 24px;font-size:13px;font-weight:500}
.nav a{color:#94a3b8;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
.nav a:hover{color:{{PRIMARY}};border-color:{{PRIMARY}};text-decoration:none}

.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 64px}

.header{display:flex;justify-content:space-between;align-items:flex-end;padding:24px 0 32px;border-bottom:1px solid rgba(148,163,184,.08);margin-bottom:32px}
.header h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,{{GRADIENT}});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{font-size:13px;color:#64748b;text-align:right}
.header .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#34d399;font-weight:600}
.header .live::before{content:'';width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* KPI GRID — 핵심 지표 카드 (대시보드 핵심) */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.kpi-card{background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.1);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card .kpi-label{font-size:12px;color:#94a3b8;font-weight:500;margin-bottom:8px}
.kpi-card .kpi-value{font-size:32px;font-weight:900;line-height:1.1;margin-bottom:4px}
.kpi-card .kpi-change{font-size:12px;font-weight:600}
.kpi-card .kpi-change.up{color:#34d399}
.kpi-card .kpi-change.down{color:#f87171}
.kpi-card .kpi-change.flat{color:#94a3b8}
.kpi-card .kpi-sparkline{margin-top:12px;height:32px;display:flex;align-items:flex-end;gap:2px}
.kpi-card .kpi-sparkline .bar{flex:1;border-radius:2px 2px 0 0;background:{{PRIMARY_30}};min-height:4px}
.kpi-card .kpi-sparkline .bar.active{background:{{PRIMARY}}}

/* PROGRESS — 진행률 바 */
.progress-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid rgba(148,163,184,.06)}
.progress-row .prog-label{flex:0 0 140px;font-size:14px;color:#cbd5e1;font-weight:500}
.progress-row .prog-bar{flex:1;height:10px;border-radius:5px;background:rgba(148,163,184,.1);overflow:hidden}
.progress-row .prog-bar .fill{height:100%;border-radius:5px;transition:width .6s}
.progress-row .prog-val{flex:0 0 60px;text-align:right;font-size:14px;font-weight:700}

/* STATUS BADGE */
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600}
.status::before{content:'';width:6px;height:6px;border-radius:50%}
.status.green{background:rgba(16,185,129,.12);color:#34d399}.status.green::before{background:#34d399}
.status.yellow{background:rgba(245,158,11,.12);color:#fbbf24}.status.yellow::before{background:#fbbf24}
.status.red{background:rgba(239,68,68,.12);color:#f87171}.status.red::before{background:#f87171}
.status.blue{background:rgba(59,130,246,.12);color:#60a5fa}.status.blue::before{background:#60a5fa}

/* 공통 */
.section{margin-bottom:40px;scroll-margin-top:72px}
.section h2{font-size:20px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid {{PRIMARY_20}};color:#f1f5f9}
.card{background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.1);border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,{{PRIMARY}},{{SECONDARY}})}
.card h3{font-size:16px;font-weight:700;margin-bottom:12px;color:#f1f5f9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.tbl{width:100%;border-collapse:collapse;margin:16px 0}
.tbl th{text-align:left;font-size:12px;color:#94a3b8;padding:10px 14px;border-bottom:1px solid rgba(148,163,184,.15);font-weight:500;background:rgba(15,23,42,.4)}
.tbl td{font-size:13px;padding:10px 14px;border-bottom:1px solid rgba(148,163,184,.08);color:#cbd5e1}
.quote{border-left:3px solid {{PRIMARY}};padding:16px 20px;margin:16px 0;background:{{PRIMARY_06}};border-radius:0 8px 8px 0;font-size:15px;color:{{PRIMARY_LIGHT}}}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px;font-size:14px;color:#cbd5e1}li strong{color:#f1f5f9}
.footer{text-align:center;padding:32px 0;color:#475569;font-size:13px;border-top:1px solid rgba(148,163,184,.1);margin-top:48px}
@media print{body{background:#fff;color:#1e293b}.nav{display:none}.card,.kpi-card{border:1px solid #e2e8f0;background:#f8fafc}.card::before,.kpi-card::before{display:none}.header h1{-webkit-text-fill-color:#1e293b}.header .live{display:none}}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start;gap:12px}.header h1{font-size:22px}}
</style>
</head>
<body>
<!--
  DASHBOARD TEMPLATE
  차별화 컴포넌트:
  - .header .live — 실시간 업데이트 펄스 아이콘
  - .kpi-grid + .kpi-card — 4열 KPI 카드 (값 + 변화량 + 스파크라인)
  - .progress-row — 항목별 진행률 바
  - .status — 상태 뱃지 (green/yellow/red/blue)
  - .kpi-sparkline — 미니 바 차트

  구조:
  1. header — 제목 + LIVE 뱃지 (좌) + 메타 (우)
  2. kpi-grid — 핵심 KPI 4개
  3. section × N — 상세 섹션 (progress + status + tbl)
  4. footer
-->
<div class="nav"><div class="nav-inner">{{NAV_LINKS}}</div></div>
<div class="wrap">
<div class="header">
<div><h1>{{TITLE}}</h1><p style="font-size:14px;color:#94a3b8;margin-top:4px">{{SUBTITLE}}</p></div>
<div class="meta">{{META}}<br><span class="live">LIVE</span></div>
</div>
{{CONTENT}}
<div class="footer">{{FOOTER}}</div>
</div>
</body>
</html>
