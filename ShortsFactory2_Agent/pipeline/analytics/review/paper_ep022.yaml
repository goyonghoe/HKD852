    note: >
      DOI, NBER 워킹페이퍼 번호, 연도, 저자 4인, 소속기관(USC et al.) 명시.
      description에 peer_reviewed=false(NBER 워킹페이퍼)를 투명하게 고지하고
      "저명 학술지 수준의 신뢰도"라는 편집자 주석 포함 — 적절한 균형.
      -1점: sample_size=null. 스크립트에도 구체적 샘플 규모 수치 없음.
      논문에 RDD(Regression Discontinuity Design) 방법론이 명시되어 있어
      description에 표기했으나 스크립트에는 "시간대 경계선 바로 양쪽 비교"로만 처리.

  academic_accuracy:
    score: 9
    min: 9
    pass: true
    note: >
      시간대 경계선(Timezone Boundary) RDD 설계로 인과관계 검증한 핵심 방법론 정확 서술.
      "일몰이 한 시간 늦은 쪽" → "더 늦게 자고 수면 짧음" → "매매 수익률 저하" 인과 사슬 정확.
      "기관 투자자에게는 이 효과가 없었다"는 twist — 원 논문의 핵심 heterogeneous effect
      정확히 반영. "수면 부족이 주의력 저하를 유발한다"는 인과 경로도 논문과 일치.
      -1점: "유의미하게 낮아졌다"는 표현의 효과 크기(effect size) 수치 미포함.

  substantial_transformation:
    score: 9
    min: 8
    pass: true
    note: >
      RDD 계량경제학 논문을 일상 침실 장면 + 수면 에너지 시각화로 완전 재구성.
