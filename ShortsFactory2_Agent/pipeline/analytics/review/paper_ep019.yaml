feedback: |
  Overall a well-constructed episode with solid academic sourcing, faithful data representation,
  and strong narrative transformation. All 8 checklist items pass individually.

  Score lands at 60/80 which falls in the REVISE band (48-63). Two areas to tighten:

  1. HOOK ACCURACY (academic_accuracy -1pt): The hook says "다이어트 콜라" but the paper tested
     sucralose directly, not diet cola as a commercial product. Consider changing to
     "제로 감미료를 먹을수록 더 배고파진다는 거" or "제로칼로리 음료를 마실수록" to avoid
     implying the study tested a specific branded product category. The body already correctly
     uses "제로 감미료" so this is a hook-only fix.

  2. VISUAL STYLE GUIDE (visual_consistency -1pt): Image prompts reference "Kurzgesagt-inspired"
     style, but the channel CLAUDE.md defines "Nano Banana Pro infographic (Nature/Science
     journal style)" as the visual identity. Align the visual_style field and all image_prompt
     strings to reference the channel's own style guide terminology. This ensures brand
     consistency across the series.

  Recommended action: Fix the hook wording and update visual style references, then re-render.
  No structural or content changes needed — the narrative arc and academic accuracy are strong.
