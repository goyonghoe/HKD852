<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Product Photo Prompt Master Pack - Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 900px;
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 30%, #2d1b69 60%, #1a1a3e 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Decorative grid */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
  }
  .orb-1 { width: 400px; height: 400px; background: #7c3aed; top: -100px; right: -50px; }
  .orb-2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; left: -30px; }
  .orb-3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; left: 10%; }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 80px;
    padding: 0 80px;
  }

  /* Left: Product mockup grid */
  .mockup-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 420px;
    flex-shrink: 0;
  }
  .mockup-cell {
    width: 130px;
    height: 130px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
  }
  .mockup-cell:nth-child(1) { background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(124,58,237,0.2)); }
  .mockup-cell:nth-child(2) { background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(59,130,246,0.2)); }
  .mockup-cell:nth-child(3) { background: linear-gradient(135deg, rgba(234,179,8,0.2), rgba(249,115,22,0.2)); }
  .mockup-cell:nth-child(4) { background: linear-gradient(135deg, rgba(34,197,94,0.2), rgba(6,182,212,0.2)); }
  .mockup-cell:nth-child(5) { background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(236,72,153,0.3)); border: 2px solid rgba(124,58,237,0.5); }
  .mockup-cell:nth-child(6) { background: linear-gradient(135deg, rgba(249,115,22,0.2), rgba(234,179,8,0.2)); }
  .mockup-cell:nth-child(7) { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(124,58,237,0.2)); }
  .mockup-cell:nth-child(8) { background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(249,115,22,0.2)); }
  .mockup-cell:nth-child(9) { background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(34,197,94,0.2)); }

  /* Right: Text content */
  .text-content {
    flex: 1;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    background: rgba(124,58,237,0.3);
    border: 1px solid rgba(124,58,237,0.5);
    border-radius: 20px;
    color: #c4b5fd;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 {
    color: #ffffff;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 20px;
  }
  h1 span {
    background: linear-gradient(135deg, #c084fc, #ec4899, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 20px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .stats {
    display: flex;
    gap: 40px;
  }
  .stat {
    text-align: center;
  }
  .stat-number {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-label {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <div class="mockup-grid">
      <div class="mockup-cell">👗</div>
      <div class="mockup-cell">💍</div>
      <div class="mockup-cell">🍰</div>
      <div class="mockup-cell">💄</div>
      <div class="mockup-cell">📸</div>
      <div class="mockup-cell">🎧</div>
      <div class="mockup-cell">🪴</div>
      <div class="mockup-cell">🐕</div>
      <div class="mockup-cell">🎒</div>
    </div>

    <div class="text-content">
      <div class="badge">AI-Powered Prompts</div>
      <h1>Product Photo<br><span>Prompt Master Pack</span></h1>
      <p class="subtitle">
        Professional product photography prompts for<br>
        Midjourney, DALL-E & Stable Diffusion.<br>
        Skip the expensive studio — generate stunning shots instantly.
      </p>
      <div class="stats">
        <div class="stat">
          <div class="stat-number">200+</div>
          <div class="stat-label">Prompts</div>
        </div>
        <div class="stat">
          <div class="stat-number">10</div>
          <div class="stat-label">Categories</div>
        </div>
        <div class="stat">
          <div class="stat-number">∞</div>
          <div class="stat-label">Variations</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
