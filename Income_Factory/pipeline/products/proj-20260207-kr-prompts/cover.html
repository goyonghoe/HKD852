<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1600, height=900">
    <title>마케팅 카피라이팅 AI 프롬프트 마스터팩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1600px;
            height: 900px;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d9488 100%);
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Pattern */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(13,148,136,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 1500px;
            height: 800px;
            padding: 60px;
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .main-title {
            font-size: 68px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 38px;
            font-weight: 600;
            color: #86efac;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .emoji-line {
            font-size: 40px;
            margin-bottom: 20px;
            letter-spacing: 15px;
        }

        /* Stats Section */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 50px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px 40px;
            min-width: 220px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .stat-number {
            font-size: 48px;
            font-weight: 900;
            color: #fde047;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .category-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .category-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .category-count {
            font-size: 14px;
            color: #86efac;
            font-weight: 600;
        }

        /* Platform Badges */
        .platform-badges {
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
        }

        .badge {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 700;
            color: #1e3a5f;
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .badge-chatgpt {
            background: linear-gradient(135deg, #10a37f 0%, #1a7f64 100%);
            color: #ffffff;
        }

        .badge-claude {
            background: linear-gradient(135deg, #d97757 0%, #cc5733 100%);
            color: #ffffff;
        }

        .badge-gemini {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: #ffffff;
        }

        /* Premium Badge */
        .premium-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1e3a5f;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 6px 24px rgba(251, 191, 36, 0.4);
            border: 3px solid #ffffff;
        }
    </style>
</head>
<body>
    <div class="premium-badge">🏆 PREMIUM</div>

    <div class="container">
        <div class="header">
            <div class="emoji-line">🛒 🇰🇷 📱 💬 📝</div>
            <h1 class="main-title">마케팅 카피라이팅<br>AI 프롬프트 마스터팩</h1>
            <p class="subtitle">한국 이커머스 특화 50개 프롬프트</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-number">50+</div>
                <div class="stat-label">프롬프트</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">10개</div>
                <div class="stat-label">카테고리</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">100%</div>
                <div class="stat-label">Before/After</div>
            </div>
        </div>

        <div class="category-grid">
            <div class="category-card">
                <div class="category-icon">🛍️</div>
                <div class="category-name">상품명</div>
                <div class="category-count">5개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">📝</div>
                <div class="category-name">상세페이지</div>
                <div class="category-count">6개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">💬</div>
                <div class="category-name">SNS 마케팅</div>
                <div class="category-count">8개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">📧</div>
                <div class="category-name">이메일</div>
                <div class="category-count">4개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">🎯</div>
                <div class="category-name">광고 카피</div>
                <div class="category-count">7개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">⭐</div>
                <div class="category-name">리뷰 관리</div>
                <div class="category-count">4개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">🎁</div>
                <div class="category-name">프로모션</div>
                <div class="category-count">5개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">📊</div>
                <div class="category-name">분석 리포트</div>
                <div class="category-count">4개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">🤝</div>
                <div class="category-name">고객 응대</div>
                <div class="category-count">4개 프롬프트</div>
            </div>
            <div class="category-card">
                <div class="category-icon">🚀</div>
                <div class="category-name">브랜딩</div>
                <div class="category-count">3개 프롬프트</div>
            </div>
        </div>

        <div class="platform-badges">
            <div class="badge badge-chatgpt">✓ ChatGPT</div>
            <div class="badge badge-claude">✓ Claude</div>
            <div class="badge badge-gemini">✓ Gemini</div>
        </div>
    </div>
</body>
</html>
