비판일: "2026-02-07"
역할: "악마의 변호인 — 왜 이게 안 되는가?"

비판결과:

  #-----------------------------------------------
  # 1위: AI 상품사진 프롬프트 컬렉션 (82점)
  #-----------------------------------------------
  - id: "idea-20260207-02"
    이름: "AI 상품사진 프롬프트 컬렉션"

    공격벡터:
      1_시장포화:
        공격: "Gumroad에 이미 ohneis Studio 등 AI 사진 프롬프트팩 다수 존재. Photography Prompt Pack이 시리즈로 Vol.1~10까지 나와있음. 후발주자의 불리함."
        심각도: "중"
        반박가능: true
        반박: "'상품사진(Product Photography)' 특화는 아직 니치. 기존 팩은 아트/패션/초상화 중심. 이커머스 셀러 타겟은 다른 시장."

      2_가격저항:
        공격: "경쟁 프롬프트팩이 $5~$20 수준. 무료 프롬프트도 많음. 가격 경쟁력 확보 어려움."
        심각도: "중"
        반박가능: true
        반박: "'상품사진에 특화된 200개+' 규모와 '카테고리별(의류/식품/주얼리) 분류'로 프리미엄 가치 제공. $19.99 번들이 적정."

      3_AI이미지품질:
        공격: "프롬프트 예시 이미지를 넣어야 하는데, AI 생성 이미지 품질이 실제 상품사진 기대치에 못 미칠 수 있음. 실망 → 환불 리스크."
        심각도: "중"
        반박가능: true
        반박: "예시 이미지는 '이런 결과를 얻을 수 있다'는 참고용. 실제 품질은 사용자의 구독 모델(Midjourney Pro 등)에 따라 다름을 명시."

      4_저작권:
        공격: "AI 생성 이미지의 상업적 사용에 대한 법적 불확실성. 이커머스에 AI 생성 사진을 쓰면 플랫폼 정책 위반 가능성."
        심각도: "낮"
        반박가능: true
        반박: "프롬프트 자체를 판매하는 것이지 이미지를 판매하는 게 아님. 면책 조항 명시로 리스크 관리 가능."

      5_재구매율:
        공격: "디지털 상품은 한 번 구매하면 끝. 반복 수익(recurring) 없음."
        심각도: "중"
        반박가능: true
        반박: "시리즈 확장(Vol.2: 식품, Vol.3: 패션 등)으로 재구매 유도. 또는 월간 구독 모델 실험 가능."

    종합판정: "Proceed"
    조건: "상품사진 니치에 집중. 범용 사진 프롬프트팩과 명확히 차별화할 것. 예시 이미지 품질 관리 필수."
    약점인지: "경쟁 심화 시장. 첫 2주 내 판매 0건이면 전략 재검토."

  #-----------------------------------------------
  # 2위: PromptRefiner — AI 프롬프트 최적화 API (82점)
  #-----------------------------------------------
  - id: "idea-20260207-10"
    이름: "PromptRefiner — AI 프롬프트 최적화 API"

    공격벡터:
      1_LLM비용:
        공격: "API 내부에서 LLM을 호출해야 함. 요청당 OpenAI/Anthropic API 비용 발생. Free tier 50 req/day는 수익 없이 비용만 발생."
        심각도: "높"
        반박가능: true
        반박: "Free tier를 10 req/day로 축소. Pro tier에서 비용 커버. 프롬프트 최적화는 짧은 입출력이라 토큰 비용 낮음."

      2_기술적한계:
        공격: "'프롬프트 최적화'의 품질을 어떻게 보장하나? 주관적 판단 영역. '최적화된 프롬프트'가 정말 더 나은 이미지를 생성한다는 증명이 어려움."
        심각도: "높"
        반박가능: false
        반박: "A/B 테스트 데이터 없이는 설득력 부족. 초기에는 '프롬프트 확장/상세화' 정도로 가치 제안 축소 필요."

      3_외부API의존:
        공격: "OpenAI/Anthropic API 키가 필요. 사용자 자신의 키를 써야 하면 진입장벽. 내 키를 쓰면 비용 부담."
        심각도: "중"
        반박가능: true
        반박: "내 API 키로 운영하되 Pro 가격에 마진 포함. Free tier는 제한적 사용으로 비용 통제."

      4_RapidAPI수수료:
        공격: "RapidAPI가 수익의 20%를 가져감. 마진 축소."
        심각도: "중"
        반박가능: true
        반박: "RapidAPI의 트래픽/발견성이 20% 수수료보다 가치 있음. 자체 사이트 병행 운영으로 분산."

      5_무료대안:
        공격: "ChatGPT에 직접 '프롬프트 최적화해줘'라고 하면 됨. API를 별도로 쓸 이유가 약함."
        심각도: "높"
        반박가능: false
        반박: "개발자가 앱에 통합할 때 API가 필요. 하지만 일반 사용자에게는 ChatGPT면 충분."

    종합판정: "Kill"
    사유: "블로킹 이슈 2개 — (1) 품질 증명 불가, (2) ChatGPT 무료 대안으로 API 수요 불확실. LLM 비용 구조도 불리. 7일 타임박스 내 이 문제들을 해결하기 어려움."
    교훈: "LLM 래핑 API는 무료 대안(ChatGPT 직접 사용) 대비 명확한 차별점이 없으면 실패. 자체 모델/데이터가 없는 래핑은 리스크."

  #-----------------------------------------------
  # 3위: AI 이력서 점수 분석 API (78점)
  #-----------------------------------------------
  - id: "idea-20260207-06"
    이름: "AI 이력서 점수 분석 API"

    공격벡터:
      1_동일LLM문제:
        공격: "PromptRefiner와 동일하게 LLM 래핑. ChatGPT에 '내 이력서 평가해줘'라고 하면 되는데 API를 쓸 이유?"
        심각도: "중"
        반박가능: true
        반박: "차이점: (1) 구조화된 JSON 응답(점수, 카테고리별 피드백), (2) ATS 호환성 체크, (3) 채용공고와의 키워드 매칭률. ChatGPT의 자유형 답변 vs 정형화된 분석 리포트."

      2_개인정보:
        공격: "이력서는 민감한 개인정보. API로 전송하는 것에 대한 프라이버시 우려. GDPR/개인정보보호법 이슈."
        심각도: "높"
        반박가능: true
        반박: "데이터 보관 안 함 명시. 개인정보처리방침 작성. 유럽 사용자 제외(초기). API 통과 후 즉시 삭제."

      3_기존경쟁:
        공격: "RapidAPI에 이미 Resume Parser API 다수 존재. Parse Talent, AI Resume Parser 등."
        심각도: "중"
        반박가능: true
        반박: "기존 API는 '파싱(추출)'이지 '점수화(스코어링)'가 아님. 채용공고 대비 매칭 점수를 주는 API는 차별화됨."

      4_정확도신뢰:
        공격: "AI가 매긴 점수를 사용자가 신뢰할까? '85점이래서 자신감 생겼는데 떨어졌다' → 불만/환불."
        심각도: "중"
        반박가능: true
        반박: "'참고용 분석'으로 포지셔닝. '개선 포인트 발견 도구'이지 '합격 예측기'가 아님을 명확히."

      5_비용구조:
        공격: "PromptRefiner와 동일한 LLM 비용 문제."
        심각도: "중"
        반박가능: true
        반박: "이력서 분석은 긴 입력 + 구조화 출력이라 토큰 비용 더 높음. 하지만 Pro $14.99/월이면 마진 확보 가능."

    종합판정: "Proceed"
    조건: "파싱이 아닌 '스코어링'으로 명확히 차별화. 개인정보처리방침 필수. 면책 조항 필수. Free tier 5 req/day로 비용 통제."
    약점인지: "LLM 비용 구조 모니터링 필수. 첫 달 비용 > 수익이면 가격 조정."

