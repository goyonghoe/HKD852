<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSBL Log Schema Viewer</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --card2: #161822;
        --border: #2a2d3a;
        --text: #e4e4e7;
        --text2: #c8c9cf;
        --muted: #8b8d98;
        --dim: #5a5d6e;
        --accent: #8b5cf6;
        --done: #22c55e;
        --wip: #3b82f6;
        --p0: #ef4444;
        --p1: #f59e0b;
        --green-bg: rgba(34, 197, 94, 0.1);
        --blue-bg: rgba(59, 130, 246, 0.1);
        --red-bg: rgba(239, 68, 68, 0.1);
        --yellow-bg: rgba(245, 158, 11, 0.1);
        --purple-bg: rgba(139, 92, 246, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        font-size: 15px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 32px 80px;
      }
      h1 {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -1.5px;
        margin-bottom: 6px;
      }
      .sub {
        font-size: 16px;
        color: var(--muted);
        margin-bottom: 32px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 8px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        transition: all 0.2s;
      }
      .tab:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .tab.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .stats {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 24px;
        min-width: 120px;
      }
      .stat-val {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        margin-top: 2px;
      }
      .search-bar {
        margin-bottom: 24px;
      }
      .search-bar input {
        width: 100%;
        max-width: 400px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      .search-bar input:focus {
        border-color: var(--accent);
      }
      .log-group {
        margin-bottom: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .log-group.open {
        border-color: var(--accent);
      }
      .log-header {
        padding: 20px 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 16px;
        user-select: none;
        transition: background 0.15s;
      }
      .log-header:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .log-status {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .log-name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.3px;
        flex: 1;
      }
      .log-cat {
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 8px;
        background: var(--purple-bg);
        color: var(--accent);
      }
      .log-count {
        font-size: 13px;
        color: var(--dim);
        font-weight: 700;
      }
      .log-chevron {
        font-size: 20px;
        color: var(--muted);
        transition: transform 0.3s;
      }
      .log-group.open .log-chevron {
        transform: rotate(180deg);
        color: var(--accent);
      }
      .log-def {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .log-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease-out;
      }
      .log-group.open .log-body {
        max-height: 2000px;
        transition: max-height 0.5s ease-in;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        padding: 10px 16px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        border-bottom: 1px solid var(--border);
        background: var(--card2);
        white-space: nowrap;
      }
      td {
        padding: 10px 16px;
        font-size: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        color: var(--text2);
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      .col-name {
        font-weight: 700;
        color: var(--text);
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 13px;
      }
      .col-type {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 12px;
        color: var(--wip);
      }
      .col-sample {
        font-size: 12px;
        color: var(--dim);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .col-note {
        font-size: 12px;
        color: var(--dim);
        max-width: 250px;
      }
      .ver-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .ver-001 {
        background: var(--green-bg);
        color: var(--done);
      }
      .ver-002 {
        background: var(--blue-bg);
        color: var(--wip);
      }
      .status-icon {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .st-green {
        background: var(--done);
      }
      .st-yellow {
        background: var(--p1);
      }
      .st-red {
        background: var(--p0);
      }
      .st-black {
        background: var(--dim);
      }
      .footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
      .legend {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        font-size: 13px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .funnel-map {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
      }
      .funnel-map-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .funnel-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 13px;
      }
      .funnel-screen {
        font-weight: 700;
        color: var(--accent);
        min-width: 120px;
      }
      .funnel-action {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 12px;
        color: var(--text2);
        padding: 3px 10px;
        border-radius: 6px;
        background: var(--card2);
      }
      @media (max-width: 768px) {
        .container {
          padding: 24px 16px 60px;
        }
        h1 {
          font-size: 24px;
        }
        .stats {
          gap: 10px;
        }
        .stat {
          padding: 12px 16px;
          min-width: 100px;
        }
        .stat-val {
          font-size: 22px;
        }
        .log-header {
          padding: 14px 16px;
          gap: 10px;
        }
        .log-name {
          font-size: 15px;
        }
        th,
        td {
          padding: 8px 10px;
          font-size: 12px;
        }
        .col-sample,
        .col-note {
          max-width: 120px;
        }
      }
    </style>
  </head>

      };

      const greens = LOGS.filter((l) => l.status === "green").length;

`;

      // Tabs

      let activeCat = "전체";
      function renderTabs() {

          .map(
            (c) =>
              `<div class="tab${c === activeCat ? " active" : ""}" onclick="filterCat('${c}')">${c}</div>`,
          )
          .join("");
      }
      function filterCat(c) {
        activeCat = c;
        renderTabs();
        renderLogs();
      }

      // Search
      document
        .getElementById("search")
        .addEventListener("input", () => renderLogs());

      function renderLogs() {
        const q = document.getElementById("search").value.toLowerCase();
        const el = document.getElementById("logs");
        let html = "";
        LOGS.forEach((log, i) => {
          if (activeCat !== "전체" && log.cat !== activeCat) return;
          const matchLog =
            log.name.toLowerCase().includes(q) ||
            log.def.toLowerCase().includes(q) ||
            log.cat.toLowerCase().includes(q);
          const matchProps = log.props.some(
            (p) =>
              p.name.toLowerCase().includes(q) ||
              p.def.toLowerCase().includes(q),
          );
          if (q && !matchLog && !matchProps) return;

          const verClass = log.ver === "0.0.1" ? "ver-001" : "ver-002";
          html += `<div class="log-group" id="lg-${i}">`;
          html += `<div class="log-header" onclick="toggleLog(${i})">`;
          html += `<span class="log-status ${STATUS_COLOR[log.status]}"></span>`;
          html += `<span class="log-name">${log.name}</span>`;
          html += `<span class="log-cat">${log.cat}</span>`;
          html += `<span class="ver-badge ${verClass}">${log.ver}</span>`;
          html += `<span class="log-count">${log.props.length}개 속성</span>`;
          html += `<span class="log-chevron">▾</span>`;
          html += `</div>`;
          html += `<div class="log-body">`;
          if (log.def)
            html += `<div style="padding:0 24px 12px;font-size:14px;color:var(--muted)">${log.def}</div>`;
          html += `<table><thead><tr><th>상태</th><th>속성명</th><th>설명</th><th>타입</th><th>샘플 값</th><th>비고</th></tr></thead><tbody>`;
          log.props.forEach((p) => {
            const icon = `<span class="status-icon ${STATUS_COLOR[p.status]}"></span>`;
            html += `<tr><td>${icon}</td><td class="col-name">${p.name}</td><td>${p.def}</td><td class="col-type">${p.type}</td><td class="col-sample" title="${p.sample}">${p.sample}</td><td class="col-note">${p.note}</td></tr>`;
          });
          html += `</tbody></table>`;
          // Funnel map
          if (log.funnel) {
            html += `<div class="funnel-map"><div class="funnel-map-title">screenName + actionName 조합 맵</div>`;
            log.funnel.forEach((f) => {
              html += `<div style="margin-bottom:10px"><div class="funnel-row"><span class="funnel-screen">${f.screen}</span></div>`;
              f.actions.forEach((a) => {
                html += `<div class="funnel-row" style="padding-left:24px"><span style="color:var(--dim);margin-right:4px">└</span><span class="funnel-action">${a}</span></div>`;
              });
              html += `</div>`;
            });
            html += `</div>`;
          }
          html += `</div></div>`;
        });
        el.innerHTML =
          html ||
          '<div style="text-align:center;padding:60px;color:var(--muted)">검색 결과 없음</div>';
      }
      function toggleLog(i) {
        document.getElementById("lg-" + i).classList.toggle("open");

      renderLogs();
