<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSBL 런칭 현황 브리핑</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --card2: #161822;
        --border: #2a2d3a;
        --text: #e4e4e7;
        --text2: #c8c9cf;
        --muted: #8b8d98;
        --dim: #5a5d6e;
        --p0: #ef4444;
        --p1: #f59e0b;
        --p2: #6b7280;
        --done: #22c55e;
        --wip: #3b82f6;
        --accent: #8b5cf6;
        --red-bg: rgba(239, 68, 68, 0.1);
        --green-bg: rgba(34, 197, 94, 0.1);
        --blue-bg: rgba(59, 130, 246, 0.1);
        --yellow-bg: rgba(245, 158, 11, 0.1);
        --purple-bg: rgba(139, 92, 246, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        font-size: 17px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 48px 100px;
      }

      /* ===== HEADER ===== */
      .report-header {
        text-align: center;
        margin-bottom: 80px;
        padding-bottom: 60px;
        border-bottom: 1px solid var(--border);
      }
      .report-header h1 {
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -2px;
        margin-bottom: 10px;
      }
      .report-sub {
        font-size: 22px;
        color: var(--muted);
        margin-bottom: 40px;
        font-weight: 500;
      }
      .report-meta {
        display: flex;
        justify-content: center;
        gap: 32px;
        color: var(--dim);
        font-size: 16px;
      }

      /* ===== OVERALL ===== */
      .overall {
        margin-bottom: 72px;
      }
      .overall-label {
        font-size: 36px;
        font-weight: 900;
        margin-bottom: 28px;
        letter-spacing: -1px;
      }
      .overall-trio {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 28px;
      }
      .trio-item {
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 20px;
      }
      .trio-val {
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .trio-label {
        font-size: 17px;
        color: var(--muted);
        font-weight: 700;
        margin-top: 6px;
      }
      .trio-count {
        font-size: 15px;
        color: var(--dim);
        margin-top: 4px;
      }
      .overall-bar {
        height: 36px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      .overall-fill-done {
        height: 100%;
        background: var(--done);
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 12px 0 0 12px;
      }
      .overall-fill-wip {
        height: 100%;
        background: var(--wip);
        position: absolute;
        top: 0;
      }
      .overall-legend {
        display: flex;
        gap: 28px;
        margin-top: 14px;
        font-size: 15px;
        color: var(--muted);
        justify-content: center;
      }
      .overall-legend span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-done {
        background: var(--done);
      }
      .dot-wip {
        background: var(--wip);
      }
      .dot-todo {
        background: var(--dim);
      }

      /* ===== DEPT ACCORDION ===== */
      .dept {
        margin-bottom: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        transition: border-color 0.3s;
      }
      .dept.open {
        border-color: var(--accent);
        margin-bottom: 48px;
      }

      /* HEADER — always visible */
      .dept-head {
        padding: 40px 44px;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }
      .dept-head:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .dept-head-row1 {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      .dept-title {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dept-name {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .dept-accent {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dept-name-text {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .dept-subtitle {
        font-size: 18px;
        color: var(--muted);
        font-weight: 500;
        margin-top: 2px;
        padding-left: 24px;
      }
      .dept-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .dept-count {
        font-size: 24px;
        color: var(--muted);
        font-weight: 700;
      }
      .dept-chevron {
        font-size: 32px;
        color: var(--muted);
        transition: transform 0.3s;
        line-height: 1;
      }
      .dept.open .dept-chevron {
        transform: rotate(180deg);
        color: var(--accent);
      }

      /* METRICS in header */
      .dept-trio {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 20px;
      }
      .dept-metric {
        text-align: center;
        background: var(--card2);
        border-radius: 14px;
        padding: 20px 12px;
      }
      .dept-metric-val {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .dept-metric-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
        margin-top: 4px;
      }
      .dept-metric-count {
        font-size: 13px;
        color: var(--dim);
        margin-top: 2px;
      }

      /* BAR in header */
      .dept-bar-wrap {
        height: 24px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }
      .dept-bar-done {
        height: 100%;
        background: var(--done);
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 10px 0 0 10px;
      }
      .dept-bar-wip {
        height: 100%;
        background: var(--wip);
        position: absolute;
        top: 0;
      }

      /* BODY — collapsible */
      .dept-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease-out;
      }
      .dept.open .dept-body {
        max-height: 3000px;
        transition: max-height 0.6s ease-in;
      }
      .dept-body-inner {
        padding: 8px 0 12px;
        border-top: 1px solid var(--border);
      }

      /* SUB-CAT */
      .sub-cats {
        padding: 24px 36px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .sub-cat {
        flex: 1;
        min-width: 200px;
        background: var(--card2);
        border-radius: 14px;
        padding: 22px 24px;
      }
      .sub-cat-name {
        font-size: 16px;
        color: var(--text);
        font-weight: 800;
        margin-bottom: 10px;
      }
      .sub-cat-trio {
        display: flex;
        gap: 20px;
        font-size: 15px;
        font-weight: 700;
      }

      /* TASK LIST */
      .task-list {
        padding: 16px 36px 28px;
      }
      .task-list-title {
        font-size: 16px;
        color: var(--muted);
        font-weight: 800;
        margin-bottom: 16px;
        letter-spacing: 0.3px;
      }
      .task-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 16px;
        color: var(--text2);
        line-height: 1.5;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .task-item:last-child {
        border-bottom: none;
      }
      .task-item:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .task-no {
        font-size: 14px;
        color: var(--dim);
        min-width: 32px;
        font-weight: 700;
      }
      .task-name {
        flex: 1;
        font-weight: 500;
      }
      .task-owner {
        font-size: 14px;
        color: var(--dim);
        min-width: 70px;
        text-align: right;
      }
      .task-status {
        font-size: 13px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .st-done {
        background: var(--green-bg);
        color: var(--done);
      }
      .st-wip {
        background: var(--blue-bg);
        color: var(--wip);
      }
      .st-todo {
        background: rgba(107, 114, 128, 0.1);
        color: var(--p2);
      }
      .tier-badge {
        font-size: 13px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .tier-p0 {
        background: var(--red-bg);
        color: var(--p0);
      }
      .tier-p1 {
        background: var(--yellow-bg);
        color: var(--p1);
      }
      .tier-p2 {
        background: rgba(107, 114, 128, 0.1);
        color: var(--p2);
      }

      /* NOTES */
      .dept-notes {
        padding: 0 36px 28px;
      }
      .note-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        margin-bottom: 10px;
        font-size: 16px;
        color: var(--text2);
        line-height: 1.7;
      }
      .note-item:last-child {
        margin-bottom: 0;
      }
      .note-bullet {
        color: var(--accent);
        font-size: 20px;
        font-weight: 900;
        flex-shrink: 0;
        line-height: 1.5;
      }

      /* EXPAND ALL */
      .expand-bar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 24px;
        gap: 12px;
      }
      .expand-btn {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 20px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .expand-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* FOOTER */
      .report-footer {
        margin-top: 60px;
        padding-top: 32px;
        border-top: 1px solid var(--border);
        font-size: 16px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .footer-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
        font-size: 17px;
      }
      .footer-link:hover {
        text-decoration: underline;
      }

      /* LOADING */
      .loading {
        text-align: center;
        padding: 160px 20px;
        color: var(--muted);
        font-size: 20px;
      }
      .loading .spin {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* PRINT */
      @media print {
        body {
          background: #fff;
          color: #111;
          font-size: 14px;
        }
        .container {
          padding: 20px;
        }
        .dept,
        .overall,
        .trio-item {
          border-color: #ddd;
          background: #f9f9f9;
        }
        .dept-head {
          background: #f0f0f0;
        }
        .dept-body {
          max-height: none !important;
        }
        .report-footer,
        .expand-bar {
          display: none;
        }
      }

      /* ===== MOBILE 768 ===== */
      @media (max-width: 768px) {
        .container {
          padding: 36px 22px 60px;
        }
        .report-header {
          margin-bottom: 48px;
          padding-bottom: 40px;
        }
        .report-header h1 {
          font-size: 34px;
        }
        .report-sub {
          font-size: 17px;
          margin-bottom: 24px;
        }
        .report-meta {
          flex-direction: column;
          gap: 6px;
          font-size: 14px;
        }
        .overall-label {
          font-size: 22px;
        }
        .trio-item {
          padding: 24px 14px;
          border-radius: 16px;
        }
        .trio-val {
          font-size: 40px;
        }
        .trio-label {
          font-size: 15px;
        }
        .trio-count {
          font-size: 14px;
        }
        .overall-bar {
          height: 28px;
        }
        .dept {
          margin-bottom: 16px;
          border-radius: 16px;
        }
        .dept.open {
          margin-bottom: 32px;
        }
        .dept-head {
          padding: 24px 24px;
        }
        .dept-name-text {
          font-size: 32px;
        }
        .dept-subtitle {
          font-size: 16px;
        }
        .dept-accent {
          width: 8px;
          height: 8px;
        }
        .dept-trio {
          gap: 10px;
        }
        .dept-metric {
          padding: 16px 8px;
          border-radius: 10px;
        }
        .dept-metric-val {
          font-size: 28px;
        }
        .dept-metric-label {
          font-size: 12px;
        }
        .sub-cats {
          padding: 20px 24px;
          gap: 12px;
        }
        .sub-cat {
          min-width: 160px;
          padding: 18px 20px;
        }
        .task-list {
          padding: 12px 24px 24px;
        }
        .dept-notes {
          padding: 0 24px 24px;
        }
        .task-item {
          padding: 12px 14px;
          font-size: 15px;
          gap: 10px;
        }
      }

      /* ===== MOBILE 480 ===== */
      @media (max-width: 480px) {
        .container {
          padding: 24px 16px 40px;
        }
        .report-header h1 {
          font-size: 26px;
          letter-spacing: -1px;
        }
        .report-sub {
          font-size: 15px;
        }
        .overall-label {
          font-size: 18px;
        }
        .overall-trio {
          gap: 10px;
        }
        .trio-item {
          padding: 18px 10px;
          border-radius: 12px;
        }
        .trio-val {
          font-size: 32px;
        }
        .trio-label {
          font-size: 13px;
        }
        .trio-count {
          font-size: 12px;
        }
        .dept-head {
          padding: 20px 18px;
        }
        .dept-head-row1 {
          margin-bottom: 14px;
        }
        .dept-name-text {
          font-size: 24px;
        }
        .dept-subtitle {
          font-size: 14px;
        }
        .dept-accent {
          width: 7px;
          height: 7px;
        }
        .dept-trio {
          gap: 8px;
        }
        .dept-metric {
          padding: 14px 6px;
          border-radius: 10px;
        }
        .dept-metric-val {
          font-size: 22px;
        }
        .dept-metric-label {
          font-size: 11px;
        }
        .sub-cats {
          flex-direction: column;
          gap: 10px;
          padding: 16px 18px;
        }
        .sub-cat {
          min-width: 0;
          padding: 16px 18px;
        }
        .task-list {
          padding: 12px 18px 20px;
        }
        .dept-notes {
          padding: 0 18px 20px;
        }
        .task-item {
          padding: 10px 12px;
          font-size: 14px;
          gap: 8px;
        }
        .task-owner {
          display: none;
        }
        .note-item {
          padding: 12px 14px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="report-header">
        <h1>SSBL 런칭 현황 브리핑</h1>
        <div class="report-sub">SUPERSTAR THEBLACKLABEL — 파트별 진행 현황</div>
        <div class="report-meta" id="meta">
          <span id="meta-date"></span>
          <span>작성: Studio Black</span>
          <span id="meta-count"></span>
        </div>
      </div>

      <!-- OVERALL -->
      <div class="overall" id="overall-section"></div>

      <!-- EXPAND BAR -->
      <div class="expand-bar">
        <button class="expand-btn" onclick="toggleAll(true)">
          전체 펼치기
        </button>
        <button class="expand-btn" onclick="toggleAll(false)">전체 접기</button>
      </div>

      <!-- DEPT SECTIONS -->
      <div id="dept-sections">
        <div class="loading">
          <div class="spin"></div>
          <br />데이터 로딩 중...
        </div>
      </div>

      <!-- FOOTER -->
      <div class="report-footer">
        <div>SSBL Launch Briefing</div>
        <div>
          <a class="footer-link" href="/">체크리스트 대시보드 &rarr;</a>
        </div>
      </div>
    </div>

    <script>
      const API = "/api/tasks";
      const DEPT_CONFIG = [
        {
          id: "dev",
          name: "개발",
          sub: "기획 · 개발 · 플랫폼",
          cats: ["기획", "플랫폼", "개발"],
          color: "var(--wip)",
          subCats: true,
        },
        {
          id: "biz",
          name: "사업",
          sub: "스토어 · 마케팅 · CS · IP",
          cats: ["사업"],
          color: "var(--p1)",
          subCats: false,
        },
        {
          id: "qa",
          name: "QA",
          sub: "통합 QA · 다국어 검증",
          cats: ["QA"],
          color: "var(--p0)",
          subCats: false,
        },
        {
          id: "snd",
          name: "사운드",
          sub: "음원 에셋 · 노트 싱크",
          cats: ["사운드"],
          color: "var(--accent)",
          subCats: false,
        },
        {
          id: "art",
          name: "아트",
          sub: "스토어 에셋 · 포토카드 · 배경",
          cats: ["아트"],
          color: "#ec4899",
          subCats: false,
        },
        {
          id: "pol",
          name: "폴리싱",
          sub: "UI 스타일 · 비주얼 · 도감",
          cats: ["폴리싱"],
          color: "#06b6d4",
          subCats: false,
        },
        {
          id: "dat",
          name: "데이터",
          sub: "MMP · KPI · BI 대시보드",
          cats: ["데이터"],
          color: "#10b981",
          subCats: false,
        },
      ];

      function tierKey(t) {
        const tier = t.tier || t.priority || "";
        return tier.includes("P0") ? 0 : tier.includes("P1") ? 1 : 2;
      }
      function tierLabel(t) {
        const tier = t.tier || t.priority || "";
        return tier.includes("P0") ? "P0" : tier.includes("P1") ? "P1" : "P2";
      }
      function statusOrder(s) {
        return s === "완료" ? 2 : s === "진행중" ? 1 : 0;
      }

      function toggleDept(el) {
        const dept = el.closest(".dept");
        dept.classList.toggle("open");
      }
      function toggleAll(open) {
        document.querySelectorAll(".dept").forEach((d) => {
          if (open) d.classList.add("open");
          else d.classList.remove("open");
        });
      }

      function buildNotes(items) {
        const notes = [];
        const p0u = items.filter(
          (t) => tierKey(t) === 0 && t.status !== "완료",
        );
        if (p0u.length)
          notes.push(
            "P0 미완료 " +
              p0u.length +
              "건: " +
              p0u.map((t) => "#" + t.no + " " + t.task).join(", "),
          );
        items
          .filter((t) => t.issue && t.issue.trim())
          .forEach((t) => {
            notes.push("#" + t.no + " " + t.task + " — " + t.issue);
          });
        const no = items.filter((t) => !t.owner || !t.owner.trim());
        if (no.length) notes.push("담당자 미배정 " + no.length + "건");
        return notes;
      }

      async function init() {
        let tasks;
        try {
          const r = await fetch(API);
          const data = await r.json();
          tasks = Array.isArray(data) ? data : data.tasks || [];
        } catch (e) {
          document.getElementById("dept-sections").innerHTML =
            '<div class="loading" style="color:var(--p0)">데이터 로드 실패</div>';
          return;
        }

        // Meta
        const now = new Date();
        const yyyy = now.getFullYear(),
          mm = String(now.getMonth() + 1).padStart(2, "0"),
          dd = String(now.getDate()).padStart(2, "0");
        const dow = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];
        document.getElementById("meta-date").textContent =
          yyyy + "." + mm + "." + dd + " (" + dow + ")";
        document.getElementById("meta-count").textContent =
          "전체 " + tasks.length + "건";

        // Overall
        const aD = tasks.filter((t) => t.status === "완료").length;
        const aW = tasks.filter((t) => t.status === "진행중").length;
        const aT = tasks.length - aD - aW;
        const dP = tasks.length ? Math.round((aD / tasks.length) * 100) : 0;
        const wP = tasks.length ? Math.round((aW / tasks.length) * 100) : 0;
        const tP = tasks.length ? Math.round((aT / tasks.length) * 100) : 0;
        document.getElementById("overall-section").innerHTML = `
    <div class="overall-label">전체 현황</div>
    <div class="overall-trio">
      <div class="trio-item"><div class="trio-val" style="color:var(--done)">${dP}%</div><div class="trio-label">완료</div><div class="trio-count">${aD}건</div></div>
      <div class="trio-item"><div class="trio-val" style="color:var(--wip)">${wP}%</div><div class="trio-label">진행중</div><div class="trio-count">${aW}건</div></div>
      <div class="trio-item"><div class="trio-val" style="color:var(--dim)">${tP}%</div><div class="trio-label">미착수</div><div class="trio-count">${aT}건</div></div>
    </div>
    <div class="overall-bar">
      <div class="overall-fill-done" style="width:${dP}%"></div>
      <div class="overall-fill-wip" style="left:${dP}%;width:${wP}%"></div>
    </div>
    <div class="overall-legend">
      <span><span class="dot dot-done"></span>완료</span>
      <span><span class="dot dot-wip"></span>진행중</span>
      <span><span class="dot dot-todo"></span>미착수</span>
    </div>
  `;

        // Dept sections
        let html = "";
        DEPT_CONFIG.forEach((dept) => {
          const items = tasks.filter((t) => dept.cats.includes(t.cat || ""));
          if (!items.length) return;
          const done = items.filter((t) => t.status === "완료").length;
          const wip = items.filter((t) => t.status === "진행중").length;
          const todo = items.length - done - wip;
          const dp = Math.round((done / items.length) * 100);
          const wp = Math.round((wip / items.length) * 100);
          const tp = Math.round((todo / items.length) * 100);

          html += `<div class="dept" id="dept-${dept.id}">`;

          // ---- HEAD (always visible) ----
          html += `<div class="dept-head" onclick="toggleDept(this)">`;
          html += `<div class="dept-head-row1">`;
          html += `<div class="dept-title"><div class="dept-name"><span class="dept-accent" style="background:${dept.color}"></span><span class="dept-name-text" style="color:${dept.color}">${dept.name}</span></div><div class="dept-subtitle">${dept.sub}</div></div>`;
          html += `<div class="dept-right"><span class="dept-count">${items.length}건</span><span class="dept-chevron">▾</span></div>`;
          html += `</div>`;
          html += `<div class="dept-trio">`;
          html += `<div class="dept-metric"><div class="dept-metric-val" style="color:var(--done)">${dp}%</div><div class="dept-metric-label">완료</div><div class="dept-metric-count">${done}건</div></div>`;
          html += `<div class="dept-metric"><div class="dept-metric-val" style="color:var(--wip)">${wp}%</div><div class="dept-metric-label">진행중</div><div class="dept-metric-count">${wip}건</div></div>`;
          html += `<div class="dept-metric"><div class="dept-metric-val" style="color:var(--dim)">${tp}%</div><div class="dept-metric-label">미착수</div><div class="dept-metric-count">${todo}건</div></div>`;
          html += `</div>`;
          html += `<div class="dept-bar-wrap"><div class="dept-bar-done" style="width:${dp}%"></div><div class="dept-bar-wip" style="left:${dp}%;width:${wp}%"></div></div>`;
          html += `</div>`;

          // ---- BODY (collapsible) ----
          html += `<div class="dept-body"><div class="dept-body-inner">`;

          // Sub-categories
          if (dept.subCats && dept.cats.length > 1) {
            html += `<div class="sub-cats">`;
            dept.cats.forEach((cat) => {
              const ci = items.filter((t) => t.cat === cat);
              if (!ci.length) return;
              const cd = ci.filter((t) => t.status === "완료").length;
              const cw = ci.filter((t) => t.status === "진행중").length;
              const ct = ci.length - cd - cw;
              html += `<div class="sub-cat"><div class="sub-cat-name">${cat} ${ci.length}건</div>`;
              html += `<div class="sub-cat-trio"><span style="color:var(--done)">완료 ${cd}</span><span style="color:var(--wip)">진행 ${cw}</span><span style="color:var(--dim)">미착수 ${ct}</span></div></div>`;
            });
            html += `</div>`;
          }

          // Task list
          const sorted = [...items].sort((a, b) => {
            const s = statusOrder(a.status) - statusOrder(b.status);
            return s !== 0 ? s : tierKey(a) - tierKey(b);
          });
          html += `<div class="task-list"><div class="task-list-title">항목 상세</div>`;
          sorted.forEach((t) => {
            const tl = tierLabel(t);
            const tc =
              tl === "P0" ? "tier-p0" : tl === "P1" ? "tier-p1" : "tier-p2";
            let sc = "st-todo",
              st = t.status || "미착수";
            if (t.status === "완료") sc = "st-done";
            else if (t.status === "진행중") sc = "st-wip";
            html += `<div class="task-item"><span class="task-no">#${t.no}</span><span class="tier-badge ${tc}">${tl}</span><span class="task-name">${t.task || t.name || ""}</span><span class="task-owner">@${t.owner || "-"}</span><span class="task-status ${sc}">${st}</span></div>`;
          });
          html += `</div>`;

          // Notes
          const notes = buildNotes(items);
          if (notes.length) {
            html += `<div class="dept-notes"><div class="task-list-title">특이사항</div>`;
            notes.forEach((n) => {
              html += `<div class="note-item"><span class="note-bullet">·</span>${n}</div>`;
            });
            html += `</div>`;
          }

          html += `</div></div>`; // body-inner, body
          html += `</div>`; // dept
        });

        document.getElementById("dept-sections").innerHTML = html;
      }

      init();
    </script>
  </body>
</html>
